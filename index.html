<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fearnime — Nonton Anime Sub Indo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050f0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fearnime">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0d0b1a;
    --app-max:860px;
    --app-gutter:14px;
    --bg-elevated:rgba(236,72,153,.10);
    --card:rgba(180,150,255,.07);
    --card-hover:rgba(236,72,153,.15);
    --border:rgba(130,110,190,.22);
    --text:#f1eefb;
    --text-dim:#b3a9d6;
    --text-faint:#6f6591;
    --accent:#ec4899;
    --accent-dim:#ec48992e;
    --accent-2:#f472b6;
    --ongoing:#f472b6;
    --ended:#544a72;
    --radius:10px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background-color:#0b0a17;
    background-image:
      radial-gradient(34% 26% at 86% 10%, rgba(236,72,153,.24) 0%, rgba(236,72,153,0) 72%),
      radial-gradient(26% 20% at 5% 96%, rgba(99,80,210,.20) 0%, rgba(99,80,210,0) 72%),
      radial-gradient(55% 42% at 50% -10%, rgba(45,30,85,.45) 0%, rgba(45,30,85,0) 68%);
    background-repeat:no-repeat;
    background-attachment:fixed, fixed, fixed;
    color:var(--text); font-family:var(--font-body); -webkit-tap-highlight-color:transparent;
  }
  .poster-wrap, .continue-card, .ep-item, .setting-item, .list-row-poster, .chip, .icon-btn,
  .q-btn, .nav-ep-btn, .genre-chip, .danger-btn, .mini-refresh, .search-input, .list-row-x,
  .back-btn-inline{
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  body{padding-bottom:86px; min-height:100vh;}
  #app, #announcementBar{ max-width:var(--app-max); margin:0 auto; position:relative; }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  ::-webkit-scrollbar{height:0; width:0;}
  .container{padding:0 14px;}

  /* ---------- Announcement bar ---------- */
  .announce-bar{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(236,72,153,.14); border-bottom:1px solid rgba(236,72,153,.3);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .announce-bar .ic{color:var(--accent); flex-shrink:0;}
  .announce-bar .ic svg{width:16px; height:16px;}
  .announce-marquee{flex:1; min-width:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .announce-track{display:inline-flex; align-items:center; gap:56px; white-space:nowrap; will-change:transform; animation:announceScroll linear infinite;}
  .announce-track span{font-size:12.5px; line-height:1.5; color:var(--text); white-space:nowrap;}
  @keyframes announceScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .announce-close{flex-shrink:0; color:var(--text-faint); width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .announce-close svg{width:14px; height:14px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg, rgba(13,11,26,.98), rgba(13,11,26,.88));
    backdrop-filter:blur(8px);
    padding:14px 14px 10px;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .logo{
    font-family:var(--font-display);
    font-size:22px; letter-spacing:1px;
    color:var(--text);
  }
  .logo span{color:var(--accent);}

  /* ---------- Brand mark (icon + wordmark) ---------- */
  .brand-mark{display:flex; align-items:center; gap:9px;}
  .brand-mark-icon{width:32px; height:32px; flex-shrink:0; object-fit:contain; border-radius:9px;}
  .brand-mark-word{font-family:var(--font-display); font-size:25px; letter-spacing:1px; color:var(--text); line-height:1;}
  .brand-mark-word b{color:var(--accent); font-weight:400;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text-dim); flex-shrink:0;
  }
  .icon-btn svg{width:19px; height:19px;}
  .icon-btn:active{background:var(--card-hover);}
  .search-wrap{margin-top:10px; max-height:0; overflow:hidden; transition:max-height .22s ease;}
  .search-wrap.open{max-height:50px;}
  .search-input{
    width:100%; padding:10px 14px; border-radius:999px;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text); font-size:14px; font-family:var(--font-body);
  }
  .search-input:focus{outline:none; border-color:var(--accent);}
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- Section headers ---------- */
  .section{margin-top:22px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; padding:0 14px 10px; gap:10px;}
  .section-title{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .section-title .dot{width:6px; height:6px; border-radius:2px; background:var(--accent); display:inline-block;}
  .section-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-top:2px;}
  .section-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .see-all{font-size:11.5px; font-weight:700; color:var(--accent); font-family:var(--font-mono); white-space:nowrap;}
  .mini-refresh{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim); flex-shrink:0;
  }
  .mini-refresh svg{width:15px; height:15px;}
  .mini-refresh:active{background:var(--card-hover);}
  .mini-refresh.spin svg{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  /* ---------- Grids / scroll rows ---------- */
  .hscroll{display:flex; gap:12px; overflow-x:auto; padding:0 14px 4px; scroll-snap-type:x proximity; cursor:grab; user-select:none;}
  .hscroll.dragging{cursor:grabbing; scroll-snap-type:none;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:0 14px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:760px){.grid{grid-template-columns:repeat(5,1fr);}}

  /* ---------- Card ---------- */
  .card{width:118px; flex-shrink:0; scroll-snap-align:start;}
  .grid .card{width:auto;}
  .poster-wrap{position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:2/3; background:var(--card); border:1px solid var(--border);}
  .poster-wrap img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .badge{position:absolute; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; font-family:var(--font-mono);}
  .badge-status{top:6px; left:6px; background:var(--ongoing); color:#06210f;}
  .badge-status.END{background:var(--ended); color:#fff;}
  .badge-rating{top:6px; right:6px; background:var(--accent); color:#fff; display:flex; align-items:center; gap:2px;}
  .ep-badge{bottom:6px; right:6px; background:rgba(0,0,0,.72); color:#fff; padding:2px 6px;}
  .card-title{font-size:12.5px; font-weight:700; margin-top:7px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-type{font-size:10.5px; color:var(--text-faint); margin-top:2px; font-family:var(--font-mono); text-transform:uppercase;}

  /* ---------- Continue watching ---------- */
  .continue-card{width:220px; flex-shrink:0; scroll-snap-align:start; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .continue-thumb{position:relative; aspect-ratio:16/9; background:#000;}
  .continue-thumb img{width:100%; height:100%; object-fit:cover; opacity:.75; pointer-events:none;}
  .continue-play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .continue-play svg{width:34px; height:34px;}
  .continue-progress{position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,.2);}
  .continue-progress i{display:block; height:100%; background:var(--accent);}
  .continue-body{padding:9px 10px 11px;}
  .continue-title{font-size:12.5px; font-weight:700; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .continue-ep{font-size:11px; color:var(--text-dim); margin-top:3px; font-family:var(--font-mono);}

  /* ---------- Empty state ---------- */
  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty svg{width:52px; height:52px; margin-bottom:14px; opacity:.5;}
  .empty p{font-size:13.5px; line-height:1.6;}
  .empty .big{font-family:var(--font-display); font-size:20px; letter-spacing:.5px; color:var(--text-dim); margin-bottom:6px; display:block;}

  /* ---------- Sub page header (see all / history / favorites / settings) ---------- */
  .subpage-topbar{display:flex; align-items:center; gap:12px;}
  .subpage-topbar .back-btn-inline{
    width:36px; height:36px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .subpage-topbar .back-btn-inline svg{width:18px; height:18px;}
  .subpage-title{font-family:var(--font-display); font-size:22px; letter-spacing:.5px;}
  .subpage-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-top:-2px;}

  /* ---------- Detail page ---------- */
  .detail-hero{position:relative;}
  .detail-backdrop{width:100%; aspect-ratio:2/3; max-height:340px; object-fit:cover; filter:brightness(.5);}
  .detail-backdrop-fade{position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, var(--bg) 96%);}
  .back-btn{position:absolute; top:14px; left:14px; z-index:5; width:38px; height:38px; border-radius:50%; background:rgba(6,20,15,.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; border:1px solid var(--border);}
  .back-btn svg{width:19px; height:19px;}
  .fav-btn{position:absolute; top:14px; right:14px; z-index:5; width:38px; height:38px; border-radius:50%; background:rgba(6,20,15,.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; border:1px solid var(--border);}
  .fav-btn svg{width:19px; height:19px;}
  .fav-btn.active{color:var(--accent); border-color:var(--accent);}
  .detail-content{position:relative; margin-top:-64px; padding:0 14px;}
  .detail-poster-row{display:flex; gap:14px; align-items:flex-end;}
  .detail-poster{width:104px; flex-shrink:0; border-radius:var(--radius); overflow:hidden; border:2px solid var(--bg); box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .detail-poster img{aspect-ratio:2/3; object-fit:cover;}
  .detail-title{font-size:20px; font-weight:800; line-height:1.25; margin-bottom:6px;}
  .detail-meta-line{font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .status-pill{padding:1px 7px; border-radius:4px; font-size:10px; font-weight:800; background:var(--ongoing); color:#06210f;}
  .status-pill.Completed{background:var(--ended); color:#fff;}

  .genre-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px;}
  .genre-chip{font-size:11px; padding:4px 11px; border-radius:999px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim);}

  .synopsis{margin-top:16px; font-size:13.5px; line-height:1.65; color:var(--text-dim);}
  .synopsis.clamp{display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  .read-more{color:var(--accent); font-size:12.5px; font-weight:700; margin-top:8px; display:inline-block;}

  .play-btn{
    margin-top:18px; width:100%; padding:14px; border-radius:var(--radius);
    background:var(--accent); color:#fff; font-weight:800; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 20px var(--accent-dim);
  }
  .play-btn svg{width:19px; height:19px; flex-shrink:0;}
  .play-btn:active{transform:scale(.98);}

  .ep-list-head{display:flex; align-items:center; justify-content:space-between; margin-top:24px; margin-bottom:10px;}
  .ep-count{font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}
  .ep-list{display:flex; flex-direction:column; gap:8px; padding-bottom:20px;}
  .ep-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--border);
  }
  .ep-item:active{background:var(--card-hover);}
  .ep-item.watched{border-color:var(--accent-dim);}
  .ep-num{
    width:34px; height:34px; border-radius:8px; background:var(--bg-elevated); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--text-dim);
  }
  .ep-item.watched .ep-num{background:var(--accent); color:#fff;}
  .ep-info{flex:1; min-width:0;}
  .ep-name{font-size:13px; font-weight:700;}
  .ep-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}
  .ep-play-ic{color:var(--text-faint); flex-shrink:0;}
  .ep-play-ic svg{width:17px; height:17px; display:block;}

  /* ---------- Player page ---------- */
  .player-page{background:var(--bg);}
  .player-frame-wrap{width:100%; aspect-ratio:16/9; background:#000; position:relative;}
  .player-frame-wrap iframe, .player-frame-wrap video{width:100%; height:100%; border:0;}
  .gesture-layer{position:absolute; top:0; left:0; right:0; bottom:44px; pointer-events:none;}
  .gesture-zone{position:absolute; top:0; bottom:0; width:50%; pointer-events:auto; touch-action:manipulation;}
  .gesture-zone.gesture-left{left:0;}
  .gesture-zone.gesture-right{right:0;}
  .gesture-flash{
    position:absolute; top:50%; left:25%; transform:translate(-50%,-50%) scale(.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff;
    font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
  }
  .gesture-flash svg{width:20px; height:20px;}
  .gesture-flash-right{left:auto; right:25%; transform:translate(50%,-50%) scale(.75);}
  .gesture-flash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .gesture-flash-right.show{opacity:1; transform:translate(50%,-50%) scale(1);}
  .gesture-speed-badge{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.65); color:#fff; padding:5px 14px; border-radius:999px;
    font-family:var(--font-mono); font-weight:800; font-size:12px; opacity:0;
    transition:opacity .2s ease; pointer-events:none;
  }
  .gesture-speed-badge.show{opacity:1;}
  .player-topbar{position:absolute; top:0; left:0; right:0; padding:12px; display:flex; align-items:center; gap:10px; background:linear-gradient(180deg, rgba(0,0,0,.75), transparent); z-index:5;}
  .player-topbar .back-btn{position:static; background:rgba(0,0,0,.5);}
  .player-title-mini{font-size:12.5px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .player-body{padding:16px 14px;}
  .quality-row{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .quality-label{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-right:2px;}
  .q-btn{padding:7px 16px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-dim); font-family:var(--font-mono);}
  .q-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .player-anime-title{font-size:16px; font-weight:800;}
  .player-ep-title{font-size:12.5px; color:var(--text-dim); margin-top:4px; font-family:var(--font-mono);}
  .nav-ep-row{display:flex; gap:10px; margin-top:16px;}
  .nav-ep-btn{flex:1; padding:12px; border-radius:var(--radius); background:var(--bg-elevated); border:1px solid var(--border); font-size:12.5px; font-weight:700; text-align:center; color:var(--text-dim);}
  .nav-ep-btn.disabled{opacity:.35; pointer-events:none;}
  .nav-ep-btn.next-highlight{background:var(--accent); color:#fff; border-color:var(--accent);}
  .mini-eplist-head{margin-top:22px; margin-bottom:10px; font-size:13.5px; font-weight:800;}

  /* ---------- Custom Video Player ---------- */
  .cp-root{position:absolute; inset:0; background:#000; overflow:hidden; touch-action:manipulation;}
  .cp-root video{width:100%; height:100%; object-fit:contain; background:#000; display:block;}
  .cp-center-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.85);
    width:64px; height:64px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:6;
  }
  .cp-center-play svg{width:100%; height:100%; display:block;}
  .cp-center-play.show{opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto;}
  .cp-spinner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:var(--accent);
    animation:cpSpin .8s linear infinite; opacity:0; pointer-events:none; z-index:6; transition:opacity .15s ease;
  }
  .cp-spinner.show{opacity:1;}
  @keyframes cpSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .cp-gesture-layer{position:absolute; inset:0; z-index:4;}
  .cp-gesture-zone{position:absolute; top:0; bottom:0; width:50%; touch-action:manipulation;}
  .cp-gesture-left{left:0;}
  .cp-gesture-right{right:0;}

  .cp-flash{
    position:absolute; top:50%; left:25%; transform:translate(-50%,-50%) scale(.7);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:58px; height:58px; border-radius:50%; background:rgba(0,0,0,.62); color:#fff;
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    opacity:0; transition:opacity .22s ease, transform .22s ease; pointer-events:none; z-index:5;
  }
  .cp-flash svg{width:19px; height:19px;}
  .cp-flash-right{left:auto; right:25%; transform:translate(50%,-50%) scale(.7);}
  .cp-flash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .cp-flash-right.show{opacity:1; transform:translate(50%,-50%) scale(1);}

  .cp-speed-badge{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.65); color:#fff; padding:6px 14px; border-radius:999px;
    font-family:var(--font-mono); font-weight:800; font-size:12px; opacity:0;
    transition:opacity .2s ease; pointer-events:none; z-index:7;
  }
  .cp-speed-badge svg{width:13px; height:13px;}
  .cp-speed-badge.show{opacity:1;}

  .cp-controls{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    opacity:0; transition:opacity .25s ease;
  }
  .cp-controls.show{opacity:1;}
  .cp-controls.show .cp-top-bar, .cp-controls.show .cp-bottom-bar{pointer-events:auto;}

  .cp-top-bar{
    display:flex; align-items:center; gap:10px; padding:12px;
    background:linear-gradient(180deg, rgba(0,0,0,.75), transparent);
  }
  .cp-title{flex:1; min-width:0; font-size:12.5px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cp-top-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .cp-icon-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.14); color:#fff; flex-shrink:0;
  }
  .cp-icon-btn svg{width:17px; height:17px; display:block;}
  .cp-icon-btn:active{background:rgba(255,255,255,.18);}
  .cp-icon-btn.disabled{opacity:.35; pointer-events:none;}
  .cp-quality-chip{

<script>
/* ============================================================
   FEARNIME — data layer (localStorage demo)
============================================================ */
const DB_KEY_ANIMES = 'fearnime_animes';
const DB_KEY_HISTORY = 'fearnime_history';
const DB_KEY_FAVORITES = 'fearnime_favorites';
const DB_KEY_ANNOUNCEMENT = 'fearnime_announcement';
const DB_KEY_ANNOUNCEMENT_DISMISSED = 'fearnime_announcement_dismissed';
const DB_KEY_SETTINGS = 'fearnime_settings';
const DB_KEY_AD_SETTINGS = 'fearnime_ad_settings';
const DB_KEY_AD_SLOTS = 'fearnime_ad_slots';
const DB_KEY_TICKETS = 'fearnime_tickets';
const DB_KEY_TICKET_EVENT = 'fearnime_ticket_event';
const DB_KEY_CLAIMED_EVENTS = 'fearnime_claimed_events';
const DB_KEY_GENRES = 'fearnime_genres';
const DB_KEY_RESOLUTIONS = 'fearnime_resolutions';
const SEED_RESOLUTIONS = ['360p','480p','720p','1080p'];
const DB_KEY_USER = 'fearnime_user';
const GOOGLE_CLIENT_ID = '427132462258-6n8i6j3j0f97lts084fp5hvsrrpjj2vp.apps.googleusercontent.com';
const MAX_TICKETS = 999;
const SEED_GENRES = ['Action','Adventure','Comedy','Demons','Drama','Ecchi','Fantasy','Game','Harem','Historical'];
const MAX_HISTORY_ITEMS = 200;
function safeSetItem(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.warn('Penyimpanan lokal penuh, gagal menyimpan:', key); return false; }
}

const API_BASE = 'https://fearnime-api.prtamadnn.workers.dev';

const CACHE = {
  animes: [],
  genres: [],
  resolutions: [...SEED_RESOLUTIONS],
  settings: {logoUrl:'', splashLogoUrl:'', splashTagline:'STREAMING SEREM · SUB INDO'},
  adSettings: {adGateEnabled:false, ticketsPerAd:3, ticketCostPerEpisode:1},
  adSlots: [],
  announcement: {enabled:false, text:''},
  ticketEvent: null,
  loaded: false
};
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('API ' + path + ' -> ' + res.status);
  return res.json();
}
async function loadRemoteData(){
  try{
    const [animes, genres, resolutions, settings, adSettings, adSlots, announcement, ticketEvent] = await Promise.all([
      apiGet('/api/animes'),
      apiGet('/api/genres'),
      apiGet('/api/resolutions'),
      apiGet('/api/settings'),
      apiGet('/api/ad-settings'),
      apiGet('/api/ad-slots'),
      apiGet('/api/announcement'),
      apiGet('/api/ticket-event')
    ]);
    CACHE.animes = animes || [];
    CACHE.genres = genres && genres.length ? genres : [...SEED_GENRES];
    CACHE.resolutions = resolutions && resolutions.length ? resolutions : [...SEED_RESOLUTIONS];
    if(settings) CACHE.settings = Object.assign({}, CACHE.settings, settings);
    if(adSettings) CACHE.adSettings = Object.assign({}, CACHE.adSettings, adSettings);
    CACHE.adSlots = adSlots || [];
    if(announcement) CACHE.announcement = announcement;
    CACHE.ticketEvent = ticketEvent || null;
  }catch(e){
    console.warn('Gagal memuat data dari API, situs jalan dengan data kosong:', e);
  }
  CACHE.loaded = true;
}

const DB = {
  getAnimes(){ return CACHE.animes; },
  getAnime(id){ return CACHE.animes.find(a=>a.id===id) || null; },
  getHistory(){
    try{ return JSON.parse(localStorage.getItem(DB_KEY_HISTORY)) || []; }catch(e){ return []; }
  },
  saveHistory(list){
    const trimmed = list.slice(0, MAX_HISTORY_ITEMS);
    const ok = safeSetItem(DB_KEY_HISTORY, JSON.stringify(trimmed));
    if(!ok){
      safeSetItem(DB_KEY_HISTORY, JSON.stringify(trimmed.slice(0, Math.floor(trimmed.length/2))));
    }
  },
  addHistory(animeId, episodeNumber){
    let list = this.getHistory();
    list = list.filter(h=>!(h.animeId===animeId && h.episodeNumber===episodeNumber));
    list.unshift({animeId, episodeNumber, timestamp:Date.now()});
    this.saveHistory(list);
  },
  removeHistoryForAnime(animeId){
    let list = this.getHistory().filter(h=>h.animeId!==animeId);
    this.saveHistory(list);
  },
  getFavorites(){
    try{ return JSON.parse(localStorage.getItem(DB_KEY_FAVORITES)) || []; }catch(e){ return []; }
  },
  saveFavorites(list){ safeSetItem(DB_KEY_FAVORITES, JSON.stringify(list)); },
  toggleFavorite(animeId){
    let list = this.getFavorites();
    const idx = list.indexOf(animeId);
    if(idx>-1){ list.splice(idx,1); } else { list.unshift(animeId); }
    this.saveFavorites(list);
    return idx===-1;
  },
  isFavorite(animeId){ return this.getFavorites().includes(animeId); },
  clearCache(){
    localStorage.removeItem(DB_KEY_HISTORY);
    localStorage.removeItem(DB_KEY_FAVORITES);
  },
  getAnnouncement(){ return CACHE.announcement; },
  getSettings(){ return CACHE.settings; },
  getAdSettings(){ return CACHE.adSettings; },
  getAdSlots(){ return CACHE.adSlots; },
  getTickets(){
    const v = parseInt(localStorage.getItem(DB_KEY_TICKETS));
    return isNaN(v) ? 0 : Math.max(0, Math.min(MAX_TICKETS, v));
  },
  setTickets(v){
    const clamped = Math.max(0, Math.min(MAX_TICKETS, Math.round(v)||0));
    safeSetItem(DB_KEY_TICKETS, String(clamped));
    return clamped;
  },
  addTickets(delta){
    return this.setTickets(this.getTickets() + delta);
  },
  getTicketEvent(){ return CACHE.ticketEvent; },
  getGenres(){ return CACHE.genres; },
  getResolutions(){ return CACHE.resolutions; },
  getUser(){
    try{ return JSON.parse(localStorage.getItem(DB_KEY_USER)) || null; }
    catch(e){ return null; }
  },
  saveUser(user){ return safeSetItem(DB_KEY_USER, JSON.stringify(user)); },
  clearUser(){ localStorage.removeItem(DB_KEY_USER); }
};

/* ============================================================
   Helpers
============================================================ */
function latestEpisodeNumber(anime){
  if(!anime.episodes || !anime.episodes.length) return 0;
  return Math.max(...anime.episodes.map(e=>e.number));
}
function esc(str){
  const d = document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML;
}
function escAttr(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'baru saja';
  if(s<3600) return Math.floor(s/60)+' menit lalu';
  if(s<86400) return Math.floor(s/3600)+' jam lalu';
  return Math.floor(s/86400)+' hari lalu';
}
function driveIdFromUrl(url){
  if(!url) return null;
  let u;
  try{ u = new URL(url); }catch(e){ return null; }
  const host = u.hostname.toLowerCase();
  const isDriveHost = host==='drive.google.com' || host.endsWith('.drive.google.com') ||
                       host==='docs.google.com' || host.endsWith('.docs.google.com');
  if(!isDriveHost) return null;
  const m1 = u.pathname.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m1) return m1[1];
  const idParam = u.searchParams.get('id');
  if(idParam) return idParam;
  return null;
}
function isDirectVideo(url){
  if(!url) return false;
  if(driveIdFromUrl(url)) return false;
  if(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(url)) return true;
  try{
    const host = new URL(url).hostname.toLowerCase();
    if(host.endsWith('.workers.dev')) return true;
  }catch(e){}
  return false;
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function makeDraggable(el){
  if(!el) return;
  let isDown=false, startX=0, scrollStart=0, moved=false;
  el.addEventListener('mousedown', e=>{
    isDown=true; moved=false; el.classList.add('dragging');
    startX = e.pageX; scrollStart = el.scrollLeft;
  });
  window.addEventListener('mouseup', ()=>{ isDown=false; el.classList.remove('dragging'); });
  window.addEventListener('mousemove', e=>{
    if(!isDown) return;
    const dx = e.pageX - startX;
    if(Math.abs(dx)>4) moved=true;
    el.scrollLeft = scrollStart - dx;
  });
  el.addEventListener('click', e=>{
    if(moved){ e.preventDefault(); e.stopPropagation(); }
  }, true);
}

const DEFAULT_LOGO_URL = 'https://placehold.co/64x64/ec4899/1b0f2e?text=F';
function brandMarkHtml(){
  const s = DB.getSettings();
  const src = s.logoUrl || DEFAULT_LOGO_URL;
  return `<div class="brand-mark"><img class="brand-mark-icon" src="${esc(src)}" alt="Fearnime"></div>`;
}
function applySplashSettings(){
  const s = DB.getSettings();
  const logoUrl = s.splashLogoUrl || s.logoUrl || DEFAULT_LOGO_URL;
  const el = document.getElementById('splashLogoSvg');
  if(el) el.src = logoUrl;
  const tagEl = document.getElementById('splashTagline');
  if(tagEl && s.splashTagline) tagEl.textContent = s.splashTagline;
}

/* ============================================================
   Google Authentication (Google Identity Services) — baru
============================================================ */
function decodeJwtResponse(token){
  try{
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c=>
      '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(jsonPayload);
  }catch(e){ return null; }
}
function handleCredentialResponse(response){
  const payload = decodeJwtResponse(response.credential);
  if(!payload){ toast('Gagal login dengan Google'); return; }
  const user = {
    name: payload.name || '',
    email: payload.email || '',
    picture: payload.picture || '',
    loggedInAt: Date.now()
  };
  DB.saveUser(user);
  toast(`Halo, ${user.name.split(' ')[0] || 'pengguna'}!`);
  renderAuthUI();
}
function initGoogleAuth(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: false
  });
  const btnWrap = document.getElementById('googleSignInBtnWrap');
  if(btnWrap && !DB.getUser()){
    btnWrap.innerHTML = '';
    google.accounts.id.renderButton(btnWrap, { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', width:260 });
    google.accounts.id.prompt();
  }
}
function logout(){
  DB.clearUser();
  if(window.google && google.accounts && google.accounts.id){
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  toast('Berhasil logout');
  renderAuthUI();
}
function renderAuthUI(){
  const mount = document.getElementById('authBlock');
  if(!mount) return;
  const user = DB.getUser();
  if(!user){
    mount.innerHTML = `
      <div class="auth-login-card">
        <div class="auth-login-title">Masuk ke Fearnime</div>
        <div class="auth-login-sub">Login dengan Google untuk personalisasi komentar &amp; menyimpan preferensi kamu.</div>
        <div id="googleSignInBtnWrap"></div>
      </div>
    `;
    initGoogleAuth();
  } else {
    mount.innerHTML = `
      <div class="auth-profile-card">
        <div class="auth-profile-head">
          <div class="auth-profile-head-title">Akun Saya</div>
          <div class="auth-profile-head-actions">
            <button class="auth-chip-btn accent" id="editProfileBtn">Edit</button>
          </div>
        </div>
        <div class="auth-profile-body">
          <img class="auth-avatar" src="${esc(user.picture)}" alt="${esc(user.name)}" onerror="this.style.opacity=0">
          <div style="min-width:0;">
            <div class="auth-profile-name">${esc(user.name)}</div>
            <div class="auth-profile-email">${esc(user.email)}</div>
          </div>
        </div>
        <div class="auth-profile-foot">
          <button class="auth-logout-btn" id="logoutBtn">Log Out</button>
        </div>
      </div>
    `;
    const editBtn = document.getElementById('editProfileBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if(editBtn) editBtn.addEventListener('click', ()=> navigate('/edit-profile'));
    if(logoutBtn) logoutBtn.addEventListener('click', logout);
  }
}

/* ---------- EDIT PROFIL ---------- */
let editProfilePicDraft = null;
function renderEditProfile(){
  const user = DB.getUser();
  if(!user){ navigate('/settings'); return; }
  editProfilePicDraft = user.picture || '';
  const initial = (user.name||'?').trim().charAt(0) || '?';

  app.innerHTML = `
    <div class="page">
      <div class="topbar">
        <div class="subpage-topbar">
          <button class="back-btn-inline" id="backBtn">${ICONS.back}</button>
          <div>
            <div class="subpage-title">Edit Profil</div>
          </div>
        </div>
      </div>
      <div class="edit-profile-wrap">
        <div class="edit-profile-card">
          <div class="edit-profile-avatar-wrap">
            <div class="edit-profile-avatar-fallback">${esc(initial)}</div>
            <img class="edit-profile-avatar" id="editAvatarImg" src="${esc(editProfilePicDraft)}" onerror="this.style.opacity=0" onload="this.style.opacity=1">
          </div>
          <label class="edit-profile-photo-btn" id="changePhotoBtn">
            ${ICONS.edit} Ganti Foto Profil
            <input type="file" accept="image/*" id="photoFileInput" style="display:none;">
          </label>
          <div class="field" style="margin-top:22px;">
            <label>Nama</label>
            <input id="edit_name" value="${esc(user.name)}" placeholder="Nama kamu">
          </div>
        </div>
        <button class="edit-profile-save-btn" id="saveProfileBtn">Simpan Perubahan</button>
      </div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=> navigate('/settings'));
  const fileInput = document.getElementById('photoFileInput');
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      editProfilePicDraft = reader.result;
      const img = document.getElementById('editAvatarImg');
      img.src = editProfilePicDraft;
      img.style.opacity = 1;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('saveProfileBtn').addEventListener('click', ()=>{
    const name = document.getElementById('edit_name').value.trim();
    if(!name){ toast('Nama tidak boleh kosong'); return; }
    const cur = DB.getUser();
    if(!cur){ navigate('/settings'); return; }
    cur.name = name;
    cur.picture = editProfilePicDraft || '';
    DB.saveUser(cur);
    toast('Profil disimpan');
    navigate('/settings');
  });
}

/* ============================================================
   Iklan & Tiket
============================================================ */
function ticketBadgeHtml(noNav){
  const s = DB.getAdSettings();
  if(!s.adGateEnabled) return '';
  const bal = DB.getTickets();
  return `<button class="ticket-badge ${noNav?'no-nav':''}" id="ticketBadgeBtn">⚡ ${bal} / ${MAX_TICKETS}</button>`;
}
function bindTicketBadge(){
  const btn = document.getElementById('ticketBadgeBtn');
  if(btn) btn.addEventListener('click', ()=> openAdGate(null, null, 'topup'));
}
function adBannerHtml(){
  const slot = DB.getAdSlots().find(s=>s.enabled && s.type==='Banner');
  if(!slot || !slot.code) return '';
  return `<div class="ad-banner-wrap"><iframe srcdoc="${escAttr(slot.code)}"></iframe></div>`;
}
function adNativeHtml(){
  const slot = DB.getAdSlots().find(s=>s.enabled && s.type==='Native/In-Feed');
  if(!slot || !slot.code) return '';
  return `<div class="section"><div class="ad-native-label">Iklan</div><div class="ad-native-wrap"><iframe srcdoc="${escAttr(slot.code)}"></iframe></div></div>`;
}
function genreChipsHtml(){
  const genres = DB.getGenres();
  if(!genres.length) return '';
  return `
    <div class="section">
      <div class="section-head"><div><div class="section-title"><span class="dot"></span>Genre Pilihan</div></div></div>
      <div class="genre-chip-row" id="rowGenres">${genres.map(g=>`<a class="genre-pill-btn" href="#/genre/${encodeURIComponent(g)}">${esc(g)}</a>`).join('')}</div>
    </div>
  `;
}

function tryWatchEpisode(animeId, epNumber){
  const settings = DB.getAdSettings();
  if(!settings.adGateEnabled || settings.ticketCostPerEpisode<=0){
    maybeShowInterstitial(animeId, epNumber);
    return;
  }
  const cost = settings.ticketCostPerEpisode;
  const balance = DB.getTickets();
  if(balance >= cost){
    DB.addTickets(-cost);
    maybeShowInterstitial(animeId, epNumber);
  } else {
    openAdGate(animeId, epNumber, 'unlock');
  }
}
function maybeShowInterstitial(animeId, epNumber){
  const slot = DB.getAdSlots().find(s=>s.enabled && s.type==='Interstitial');
  if(!slot){ navigate(`/play/${animeId}/${epNumber}`); return; }
  openInterstitial(slot, animeId, epNumber);
}
function openInterstitial(slot, animeId, epNumber){
  const overlay = document.getElementById('adGateOverlay');
  const content = document.getElementById('adGateContent');
  content.innerHTML = `
    <div class="ad-gate-title">Iklan</div>
    <div class="ad-gate-sub">Video akan diputar setelah iklan selesai.</div>
    <div class="ad-frame-wrap">${slot.code ? `<iframe srcdoc="${escAttr(slot.code)}"></iframe>` : `<span>Preview iklan interstitial</span>`}</div>
    <div class="ad-gate-actions">
      <button class="btn btn-primary" id="interstitialSkipBtn" style="flex:1;" disabled>Lewati (5s)</button>
    </div>
  `;
  overlay.style.display = 'flex';
  let t = 5;
  const btn = document.getElementById('interstitialSkipBtn');
  const timer = setInterval(()=>{
    t--;
    if(t<=0){ clearInterval(timer); btn.disabled=false; btn.textContent='Lewati Iklan'; }
    else btn.textContent = `Lewati (${t}s)`;
  },1000);
  btn.addEventListener('click', ()=>{
    overlay.style.display = 'none';
    navigate(`/play/${animeId}/${epNumber}`);
  });
}
let adGateCtx = null;
function openAdGate(animeId, epNumber, mode){
  adGateCtx = {animeId, epNumber, mode: mode||'unlock'};
  renderAdGateModal();
  document.getElementById('adGateOverlay').style.display = 'flex';
}
function closeAdGate(){
  document.getElementById('adGateOverlay').style.display = 'none';
  adGateCtx = null;
}
function renderAdGateModal(){
  const settings = DB.getAdSettings();
  const slot = DB.getAdSlots().find(s=>s.enabled && s.type==='Rewarded (Dapat Tiket)');
  const cost = settings.ticketCostPerEpisode;
  const balance = DB.getTickets();
  const content = document.getElementById('adGateContent');
  const introText = adGateCtx.mode==='unlock'
    ? `Tiket kamu tidak cukup untuk nonton episode ini (butuh ${cost}, kamu punya ${balance}). Tonton iklan untuk dapat ${settings.ticketsPerAd} tiket.`
    : `Tonton iklan untuk mendapatkan ${settings.ticketsPerAd} tiket tambahan (maks ${MAX_TICKETS}).`;
  content.innerHTML = `
    <div class="ad-gate-title">⚡ Tonton Iklan, Dapat Tiket</div>
    <div class="ad-gate-sub">${esc(introText)}</div>
    <div class="ad-frame-wrap">${slot && slot.code ? `<iframe srcdoc="${escAttr(slot.code)}"></iframe>` : `<span>Preview iklan — tempel kode iklan tipe "Rewarded" di Admin Panel &gt; Iklan &amp; Tiket</span>`}</div>
    <div class="ad-gate-actions">
      <button class="btn btn-ghost" id="adGateCancelBtn" style="flex:1;">Batal</button>
      <button class="btn btn-primary" id="adGateClaimBtn" style="flex:1;" disabled>Tunggu 5s...</button>
    </div>
  `;
  document.getElementById('adGateCancelBtn').addEventListener('click', closeAdGate);
  let t = 5;
  const claimBtn = document.getElementById('adGateClaimBtn');
  const timer = setInterval(()=>{
    t--;
    if(t<=0){ clearInterval(timer); claimBtn.disabled=false; claimBtn.textContent = `+${settings.ticketsPerAd} Klaim Tiket`; }
    else claimBtn.textContent = `Tunggu ${t}s...`;
  },1000);
  claimBtn.addEventListener('click', ()=>{
    DB.addTickets(settings.ticketsPerAd);
    toast(`+${settings.ticketsPerAd} tiket didapat!`);
    const ctx = adGateCtx;
    closeAdGate();
    if(ctx.mode==='unlock'){
      tryWatchEpisode(ctx.animeId, ctx.epNumber);
    } else {
      route();
    }
  });
}
function checkTicketEvent(){
  const ev = DB.getTicketEvent();
  if(!ev || !ev.enabled || !ev.id || !ev.tickets) return;
  let claimed = [];
  try{ claimed = JSON.parse(localStorage.getItem(DB_KEY_CLAIMED_EVENTS)) || []; }catch(e){}
  if(claimed.includes(ev.id)) return;
  DB.addTickets(ev.tickets);
  claimed.push(ev.id);
  safeSetItem(DB_KEY_CLAIMED_EVENTS, JSON.stringify(claimed));
  setTimeout(()=> toast(`🎉 Dapat ${ev.tickets} tiket gratis — ${ev.name || 'Event'}!`), 1200);
}

/* ============================================================
   Card renderers
============================================================ */
function animeCard(a){
  const ep = latestEpisodeNumber(a);
  const statusCode = a.status==='Ongoing' ? 'ON' : 'END';
  return `
  <a class="card" href="#/detail/${a.id}">
    <div class="poster-wrap">
      <img src="${esc(a.poster)}" alt="${esc(a.title)}" loading="lazy" onerror="this.src='https://placehold.co/400x560/181c25/565c6b?text=No+Image'">
      <span class="badge badge-status ${statusCode==='END'?'END':''}">${statusCode}</span>
      <span class="badge badge-rating">${ICONS.star} ${a.rating!=null?Number(a.rating).toFixed(2):'-'}</span>
      ${ep?`<span class="badge ep-badge">Ep. ${ep}</span>`:''}
    </div>
    <div class="card-title">${esc(a.title)}</div>
    <div class="card-type">${esc(a.type)}</div>
  </a>`;
}

function continueCard(h, a){
  const total = latestEpisodeNumber(a) || a.totalEpisode || 1;
  const pct = Math.min(100, Math.round((h.episodeNumber/Math.max(total,1))*100));
  return `
  <a class="continue-card" href="javascript:void(0)" onclick="tryWatchEpisode('${a.id}', ${h.episodeNumber})">
    <div class="continue-thumb">
      <img src="${esc(a.poster)}" alt="" onerror="this.src='https://placehold.co/400x560/181c25/565c6b?text=No+Image'">
      <div class="continue-play">${ICONS.playCircle}</div>
      <div class="continue-progress"><i style="width:${pct}%"></i></div>
    </div>
    <div class="continue-body">
      <div class="continue-title">${esc(a.title)}</div>
      <div class="continue-ep">Episode ${h.episodeNumber} · ${timeAgo(h.timestamp)}</div>
    </div>
  </a>`;
}

const app = document.getElementById('app');
let searchQuery = '';
let recommendOrder = null;
let trendingOrder = null;

function ensureRecommendOrder(){
  const ids = DB.getAnimes().map(a=>a.id);
  if(!recommendOrder || recommendOrder.length!==ids.length || !ids.every(id=>recommendOrder.includes(id))){
    recommendOrder = shuffle(ids);
  }
  return recommendOrder;
}

function ensureTrendingOrder(){
  const ids = DB.getAnimes().map(a=>a.id);
  if(!trendingOrder || trendingOrder.length!==ids.length || !ids.every(id=>trendingOrder.includes(id))){
    trendingOrder = shuffle(ids);
  }
  return trendingOrder;
}

function renderAnnouncement(){
  const bar = document.getElementById('announcementBar');
  const ann = DB.getAnnouncement();
  const dismissed = localStorage.getItem(DB_KEY_ANNOUNCEMENT_DISMISSED) || '';
  if(!ann.enabled || !ann.text || !ann.text.trim() || dismissed===ann.text){
    bar.innerHTML = '';
    return;
  }
  const duration = Math.max(10, Math.min(40, ann.text.length * 0.16)).toFixed(1);
  bar.innerHTML = `
    <div class="announce-bar">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/><path d="M14 4h6v6M20 4 10 14"/></svg></span>
      <div class="announce-marquee">
        <div class="announce-track" style="animation-duration:${duration}s;">
          <span>${esc(ann.text)}</span>
          <span>${esc(ann.text)}</span>
        </div>
      </div>
      <button class="announce-close" id="announceCloseBtn">${ICONS.x}</button>
    </div>
  `;
  document.getElementById('announceCloseBtn').addEventListener('click', ()=>{
    safeSetItem(DB_KEY_ANNOUNCEMENT_DISMISSED, ann.text);
    bar.innerHTML = '';
  });
}

function navigate(hash){ location.hash = hash; }

function route(){
  const hash = location.hash.replace(/^#\//,'') || 'home';
  const parts = hash.split('/');
  window.scrollTo(0,0);
  updateBottomNav(parts[0]);
  renderAnnouncement();

  if(parts[0]==='home') return renderHome();
  if(parts[0]==='detail') return renderDetail(parts[1]);
  if(parts[0]==='play') return renderPlayer(parts[1], parseInt(parts[2]));
  if(parts[0]==='browse') return renderBrowse(parts[1]);
  if(parts[0]==='all') return renderAllAnime();
  if(parts[0]==='genre') return renderGenre(decodeURIComponent(parts[1]||''));
  if(parts[0]==='history') return renderHistory();
  if(parts[0]==='favorites') return renderFavorites();
  if(parts[0]==='settings') return renderSettings();
  if(parts[0]==='edit-profile') return renderEditProfile();
  return renderHome();
}
window.addEventListener('hashchange', route);

function updateBottomNav(routeName){
  const nav = document.getElementById('bottomNav');
  const shown = ['home','all','history','favorites','settings'].includes(routeName) ? routeName : 'home';
  nav.style.display = (routeName==='play') ? 'none' : 'block';
  document.body.style.paddingBottom = (routeName==='play') ? '0' : '86px';
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.route===shown);
  });
}
document.getElementById('bottomNav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  const icon = btn.querySelector('.nav-icon, .nav-btn-circle');
  if(icon){
    icon.classList.remove('pop');
    void icon.offsetWidth;
    icon.classList.add('pop');
  }
  navigate('/'+btn.dataset.route);
});

          <div class="section-actions">

        </div>

          <div class="empty"><span class="big">Belum ada anime</span><p>Anime yang ditambahkan akan muncul di sini.</p></div>`}
      </div>

      <div class="section">
        <div class="section-head">
          <div><div class="section-title"><span class="dot"></span>Rekomendasi</div></div>
          <div class="section-actions">
            <button class="mini-refresh" id="refreshRecommend" title="Acak ulang">${ICONS.refresh}</button>
            <a class="see-all" href="#/browse/recommend">Lihat Semua</a>
          </div>
        </div>
        ${recommended.length ? `<div class="hscroll" id="rowRecommend">${recommended.map(animeCard).join('')}</div>` : `
          <div class="empty"><span class="big">Belum ada anime</span><p>Anime yang ditambahkan akan muncul di sini.</p></div>`}

      ${adNativeHtml()}

      <div class="section">
        <div class="section-head">
          <div><div class="section-title"><span class="dot"></span>Baru Ditambahkan</div></div>

  if(refreshBtn){

function topbarHtml(){
  return `
    <div class="topbar">
      <div class="topbar-row">
        ${brandMarkHtml()}
        <button class="icon-btn" id="searchToggle">${ICONS.search}</button>
      </div>
      <div class="search-wrap" id="searchWrap">
        <input class="search-input" id="searchInput" placeholder="Cari judul anime atau genre..." value="${esc(searchQuery)}">
      </div>
    </div>
  `;
}
function bindTopbar(){
  const searchToggle = document.getElementById('searchToggle');
  const searchWrap = document.getElementById('searchWrap');
  const searchInput = document.getElementById('searchInput');
  searchToggle.addEventListener('click', ()=>{
    searchWrap.classList.toggle('open');
    if(searchWrap.classList.contains('open')) setTimeout(()=>searchInput.focus(),150);
  });
  if(searchQuery) searchWrap.classList.add('open');
  searchInput.addEventListener('input', e=>{ searchQuery = e.target.value; renderHome(); restoreFocus('searchInput'); });
}
function restoreFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}

/* ---------- BROWSE ---------- */
function renderBrowse(kind){
  const animes = DB.getAnimes();
  let title, sub, list;
  if(kind==='recommend'){
    const order = ensureRecommendOrder();
    list = order.map(id=>DB.getAnime(id)).filter(Boolean);
    title = 'Rekomendasi';
    sub = 'Urutan acak dari seluruh katalog';
  } else if(kind==='trending'){
    const order = ensureTrendingOrder();
    list = order.map(id=>DB.getAnime(id)).filter(Boolean).sort((a,b)=>(b.rating||0)-(a.rating||0));
    title = 'Trending Hari Ini';
    sub = 'Diurutkan berdasarkan rating tertinggi';
  } else {
    list = [...animes].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    title = 'Baru Ditambahkan';
    sub = 'Diurutkan dari yang paling baru';
  }

  app.innerHTML = `
    <div class="page">
      <div class="topbar">
        <div class="subpage-topbar">
          <button class="back-btn-inline" id="backBtn">${ICONS.back}</button>
          <div>
            <div class="subpage-title">${esc(title)}</div>
            <div class="subpage-sub">${sub}</div>
          </div>
        </div>
      </div>
      <div class="section" style="margin-top:16px;">
        ${list.length ? `<div class="grid">${list.map(animeCard).join('')}</div>` : `
        <div class="empty"><span class="big">Belum ada anime</span><p>Anime yang ditambahkan akan muncul di sini.</p></div>`}
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> navigate('/home'));
}

let currentQuality = null;
let currentSpeed = 1;
const SPEED_OPTIONS = [0.5, 0.75, 1, 1.25, 1.5, 2];
function renderPlayer(animeId, epNumber){
  const a = DB.getAnime(animeId);
  if(!a){ app.innerHTML = notFoundBlock(); return; }
  const episodes = [...a.episodes].sort((x,y)=>x.number-y.number);
  const epIdx = episodes.findIndex(e=>e.number===epNumber);
  const ep = episodes[epIdx];
  if(!ep){ app.innerHTML = notFoundBlock(); return; }

  DB.addHistory(a.id, ep.number);

  const prevEp = episodes[epIdx-1];
  const nextEp = episodes[epIdx+1];

  const qualityOrder = DB.getResolutions();
  const availableQ = qualityOrder.filter(q=> ep.videoUrls && ep.videoUrls[q]);
  if(!currentQuality || !availableQ.includes(currentQuality)){
    currentQuality = availableQ.length ? availableQ[availableQ.length-1] : null;
  }
  const videoUrl = currentQuality ? ep.videoUrls[currentQuality] : null;
  const isCustom = !!(videoUrl && isDirectVideo(videoUrl));

  app.innerHTML = `
    <div class="page player-page">
      <div class="player-frame-wrap" id="frameWrap">
        ${isCustom ? '' : `
        <div class="player-topbar">
          <button class="back-btn" id="backBtn">${ICONS.back}</button>
          <div class="player-title-mini">${esc(a.title)} · Ep ${ep.number}</div>
          <button class="back-btn" id="fullscreenBtn">${ICONS.fullscreen}</button>
        </div>`}
        ${videoPlayerHtml(videoUrl, {anime:a, ep, episodes, availableQ, currentQuality, hasPrev:!!prevEp, hasNext:!!nextEp})}
      </div>
      <div class="player-body">
        ${availableQ.length ? `
        <div class="quality-row">
          <span class="quality-label">Kualitas</span>
          ${availableQ.map(q=>`<button class="q-btn ${currentQuality===q?'active':''}" data-q="${q}">${q}</button>`).join('')}
        </div>` : ''}
        <div class="player-anime-title">${esc(a.title)}</div>
        <div class="player-ep-title">Episode ${ep.number} dari ${episodes.length}</div>

        <div class="nav-ep-row">
          <button class="nav-ep-btn ${!prevEp?'disabled':''}" id="prevBtn">← Sebelumnya</button>
          <button class="nav-ep-btn ${nextEp?'next-highlight':'disabled'}" id="nextBtn">Selanjutnya →</button>
        </div>

        <div class="mini-eplist-head">Semua Episode</div>
        <div class="ep-list">
          ${episodes.map(e=>`
            <a class="ep-item ${e.number===ep.number?'watched':''}" href="javascript:void(0)" onclick="tryWatchEpisode('${a.id}', ${e.number})">
              <div class="ep-num">${e.number}</div>
              <div class="ep-info">
                <div class="ep-name">Episode ${e.number}</div>
                <div class="ep-sub">${e.number===ep.number?'Sedang diputar':''}</div>
              </div>
              <div class="ep-play-ic">${ICONS.chevRight}</div>
            </a>
          `).join('')}
        </div>
      </div>
      ${ticketBadgeHtml(true)}
    </div>
  `;

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=> navigate(`/detail/${a.id}`));
  document.querySelectorAll('.q-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentQuality = btn.dataset.q;
      renderPlayer(animeId, epNumber);
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevEp) prevBtn.addEventListener('click', ()=> tryWatchEpisode(a.id, prevEp.number));
  if(nextEp) nextBtn.addEventListener('click', ()=> tryWatchEpisode(a.id, nextEp.number));
  bindTicketBadge();
  bindPlayerControls({anime:a, ep, episodes, prevEp, nextEp});
}

              `).join('')}

          </div>

              <button class="cp-icon-btn" id="cpQualitySheetClose">${ICONS.x}</button>
            </div>
            <div class="cp-sheet-list">
              ${availableQ.map(q=>`
                <button class="cp-sheet-item ${q===currentQuality?'active':''}" data-setq="${esc(q)}">

let playerResumeTime = null;
let playerResumeAutoplay = false;

function fmtTime(s){
  if(!isFinite(s) || s<0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const mm = h ? String(m).padStart(2,'0') : m;
  return (h ? h+':' : '') + mm + ':' + String(sec).padStart(2,'0');
}

function bindPlayerControls(ctx){
  const frameWrap = document.getElementById('frameWrap');
  const fsBtn = document.getElementById('fullscreenBtn');
  const fsBtn2 = document.getElementById('cpFsBtn2');
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      (frameWrap.requestFullscreen || frameWrap.webkitRequestFullscreen || frameWrap.mozRequestFullScreen || function(){}).call(frameWrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || function(){}).call(document);
    }
  }
  if(fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
  if(fsBtn2) fsBtn2.addEventListener('click', toggleFullscreen);

  document.addEventListener('fullscreenchange', function onFsChange(){
    if(document.fullscreenElement){
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(()=>{});
      }
    } else {
      if(screen.orientation && screen.orientation.unlock){
        try{ screen.orientation.unlock(); }catch(e){}
      }
      document.removeEventListener('fullscreenchange', onFsChange);
    }
  });

  const cpRoot = document.getElementById('cpRoot');
  if(!cpRoot) return;

  const video = document.getElementById('mainVideo');
  const controls = document.getElementById('cpControls');
  const centerPlay = document.getElementById('cpCenterPlay');
  const spinner = document.getElementById('cpSpinner');
  const playBtn = document.getElementById('cpPlayBtn');
  const muteBtn = document.getElementById('cpMuteBtn');
  const volSlider = document.getElementById('cpVolSlider');
  const seekTrack = document.getElementById('cpSeekTrack');
  const seekPlayed = document.getElementById('cpSeekPlayed');
  const seekBuffered = document.getElementById('cpSeekBuffered');
  const seekThumb = document.getElementById('cpSeekThumb');
  const timeCur = document.getElementById('cpTimeCur');
  const timeDur = document.getElementById('cpTimeDur');
  const epListBtn = document.getElementById('cpEpListBtn');
  const epSheetOverlay = document.getElementById('cpEpSheetOverlay');
  const epSheetClose = document.getElementById('cpEpSheetClose');
  const qualityBtn = document.getElementById('cpQualityBtn');
  const qualitySheetOverlay = document.getElementById('cpQualitySheetOverlay');
  const qualitySheetClose = document.getElementById('cpQualitySheetClose');
  const speedBtn = document.getElementById('cpSpeedBtn');
  const speedSheetOverlay = document.getElementById('cpSpeedSheetOverlay');
  const speedSheetClose = document.getElementById('cpSpeedSheetClose');
  const prevBtnCp = document.getElementById('cpPrevBtn');
  const nextBtnCp = document.getElementById('cpNextBtn');

  if(playerResumeTime != null){
    const resumeT = playerResumeTime, resumeAuto = playerResumeAutoplay;
    playerResumeTime = null; playerResumeAutoplay = false;
    video.addEventListener('loadedmetadata', function onMeta(){
      video.currentTime = Math.min(resumeT, video.duration || resumeT);
      if(resumeAuto) video.play().catch(()=>{});
      video.removeEventListener('loadedmetadata', onMeta);
    });
  }

  video.playbackRate = currentSpeed;

  video.addEventListener('loadedmetadata', ()=>{
    timeDur.textContent = fmtTime(video.duration);
    if(video.videoWidth && video.videoHeight){
      frameWrap.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
    }
  });

  function updatePlayIcon(){
    playBtn.innerHTML = video.paused ? ICONS.play : ICONS.pause;
    centerPlay.classList.toggle('show', video.paused);
  }
  function togglePlay(){
    if(video.paused) video.play().catch(()=>{}); else video.pause();
  }
  playBtn.addEventListener('click', togglePlay);
  centerPlay.addEventListener('click', togglePlay);
  video.addEventListener('play', ()=>{ updatePlayIcon(); scheduleHide(); });
  video.addEventListener('pause', ()=>{ updatePlayIcon(); showControls(true); });
  video.addEventListener('waiting', ()=> spinner.classList.add('show'));
  video.addEventListener('playing', ()=> spinner.classList.remove('show'));
  video.addEventListener('canplay', ()=> spinner.classList.remove('show'));
  updatePlayIcon();

  video.addEventListener('timeupdate', ()=>{
    if(!video.duration) return;
    const pct = Math.min(100, (video.currentTime/video.duration)*100);
    seekPlayed.style.width = pct+'%';
    seekThumb.style.left = pct+'%';
    timeCur.textContent = fmtTime(video.currentTime);
  });
  video.addEventListener('progress', ()=>{
    if(!video.duration || !video.buffered.length) return;
    try{
      const end = video.buffered.end(video.buffered.length-1);
      seekBuffered.style.width = Math.min(100,(end/video.duration)*100)+'%';
    }catch(e){}
  });
  video.addEventListener('ended', ()=>{
    updatePlayIcon();
    if(ctx.nextEp) tryWatchEpisode(ctx.anime.id, ctx.nextEp.number);
  });

  let seeking = false;
  function seekToClientX(clientX){
    if(!video.duration) return;
    const rect = seekTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    video.currentTime = pct * video.duration;
    seekPlayed.style.width = (pct*100)+'%';
    seekThumb.style.left = (pct*100)+'%';
    timeCur.textContent = fmtTime(video.currentTime);
  }
  seekTrack.addEventListener('pointerdown', e=>{
    seeking = true;
    seekTrack.setPointerCapture(e.pointerId);
    seekToClientX(e.clientX);
    showControls(true);
  });
  seekTrack.addEventListener('pointermove', e=>{ if(seeking) seekToClientX(e.clientX); });
  seekTrack.addEventListener('pointerup', ()=>{ seeking = false; scheduleHide(); });
  seekTrack.addEventListener('pointercancel', ()=>{ seeking = false; });

  video.volume = 1;
  volSlider.addEventListener('input', ()=>{
    video.volume = parseFloat(volSlider.value);
    video.muted = video.volume===0;
    muteBtn.innerHTML = video.muted ? ICONS.volumeMute : ICONS.volume;
  });
  muteBtn.addEventListener('click', ()=>{
    video.muted = !video.muted;
    muteBtn.innerHTML = video.muted ? ICONS.volumeMute : ICONS.volume;
    if(!video.muted && video.volume===0){ video.volume=1; volSlider.value=1; }
  });

  if(prevBtnCp && ctx.prevEp) prevBtnCp.addEventListener('click', ()=> tryWatchEpisode(ctx.anime.id, ctx.prevEp.number));
  if(nextBtnCp && ctx.nextEp) nextBtnCp.addEventListener('click', ()=> tryWatchEpisode(ctx.anime.id, ctx.nextEp.number));

  if(epListBtn && epSheetOverlay){
    epListBtn.addEventListener('click', ()=>{ epSheetOverlay.classList.add('show'); showControls(true); });
    epSheetClose.addEventListener('click', ()=> epSheetOverlay.classList.remove('show'));
    epSheetOverlay.addEventListener('click', e=>{ if(e.target===epSheetOverlay) epSheetOverlay.classList.remove('show'); });
    epSheetOverlay.querySelectorAll('[data-goep]').forEach(btn=>{
      btn.addEventListener('click', ()=> tryWatchEpisode(ctx.anime.id, parseInt(btn.dataset.goep)));
    });
  }

  if(qualityBtn && qualitySheetOverlay){
    qualityBtn.addEventListener('click', ()=>{ qualitySheetOverlay.classList.add('show'); showControls(true); });
    qualitySheetClose.addEventListener('click', ()=> qualitySheetOverlay.classList.remove('show'));
    qualitySheetOverlay.addEventListener('click', e=>{ if(e.target===qualitySheetOverlay) qualitySheetOverlay.classList.remove('show'); });
    qualitySheetOverlay.querySelectorAll('[data-setq]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const q = btn.dataset.setq;
        if(q === currentQuality){ qualitySheetOverlay.classList.remove('show'); return; }
        playerResumeTime = video.currentTime;
        playerResumeAutoplay = !video.paused;
        currentQuality = q;
        renderPlayer(ctx.anime.id, ctx.ep.number);
      });
    });
  }

  if(speedBtn && speedSheetOverlay){
    speedBtn.addEventListener('click', ()=>{ speedSheetOverlay.classList.add('show'); showControls(true); });
    speedSheetClose.addEventListener('click', ()=> speedSheetOverlay.classList.remove('show'));
    speedSheetOverlay.addEventListener('click', e=>{ if(e.target===speedSheetOverlay) speedSheetOverlay.classList.remove('show'); });
    speedSheetOverlay.querySelectorAll('[data-setspeed]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const sp = parseFloat(btn.dataset.setspeed);
        currentSpeed = sp;
        video.playbackRate = sp;
        speedSheetOverlay.querySelectorAll('.cp-sheet-item').forEach(it=>{
          const itSp = parseFloat(it.dataset.setspeed);
          it.classList.toggle('active', itSp===sp);
          const lbl = it.querySelector('.cp-sheet-label');
          const checkSlot = it.querySelector('svg:last-child');
        });
        speedSheetOverlay.classList.remove('show');
        toast(`Kecepatan ${sp===1?'Normal':sp+'×'}`);
      });
    });
  }

  let hideTimer = null;
  function showControls(persist){
    controls.classList.add('show');
    clearTimeout(hideTimer);
    if(!persist) scheduleHide();
  }
  function scheduleHide(){
    clearTimeout(hideTimer);
    if(video.paused) return;
    hideTimer = setTimeout(()=>{
      if(epSheetOverlay && epSheetOverlay.classList.contains('show')) return;
      if(qualitySheetOverlay && qualitySheetOverlay.classList.contains('show')) return;
      if(speedSheetOverlay && speedSheetOverlay.classList.contains('show')) return;
      controls.classList.remove('show');
    }, 3200);
  }
  cpRoot.addEventListener('pointermove', ()=> showControls());
  scheduleHide();

  const gestureLayer = document.getElementById('gestureLayer');
  const flashLeft = document.getElementById('flashLeft');
  const flashRight = document.getElementById('flashRight');
  const speedBadge = document.getElementById('speedBadge');
  let holdTimer = null, holdTriggered = false, normalRate = 1;
  const tapTimeout = {left:null, right:null};

  function showFlash(el){
    el.classList.add('show');
    clearTimeout(el.__t);
    el.__t = setTimeout(()=> el.classList.remove('show'), 450);
  }
  function seekBy(delta){
    if(!isFinite(video.duration)) return;
    video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + delta));
  }
  function startHold(){
    holdTriggered = false;
    holdTimer = setTimeout(()=>{
      holdTriggered = true;
      normalRate = currentSpeed;
      video.playbackRate = 2;
      speedBadge.classList.add('show');
    }, 450);
  }
  function endHold(){
    clearTimeout(holdTimer);
    if(holdTriggered){
      video.playbackRate = normalRate || 1;
      speedBadge.classList.remove('show');
    }
  }

  gestureLayer.querySelectorAll('.cp-gesture-zone').forEach(zone=>{
    const side = zone.dataset.side;
    zone.addEventListener('pointerdown', startHold);
    zone.addEventListener('pointerup', endHold);
    zone.addEventListener('pointerleave', endHold);
    zone.addEventListener('pointercancel', endHold);

    zone.addEventListener('click', ()=>{
      if(holdTriggered){ holdTriggered = false; return; }
      if(tapTimeout[side]){
        clearTimeout(tapTimeout[side]);
        tapTimeout[side] = null;
        seekBy(side==='left' ? -10 : 10);
        showFlash(side==='left' ? flashLeft : flashRight);
        showControls();
      } else {
        tapTimeout[side] = setTimeout(()=>{
          tapTimeout[side] = null;
          if(controls.classList.contains('show')) controls.classList.remove('show');
          else showControls();
        }, 260);
      }
    });
  });
}

/* ---------- HISTORY ---------- */
function renderHistory(){
  const raw = DB.getHistory();
  const seen = new Set();
  const items = [];
  for(const h of raw){
    if(seen.has(h.animeId)) continue;
    seen.add(h.animeId);
    const a = DB.getAnime(h.animeId);
    if(a) items.push({h,a});
  }

  app.innerHTML = `
    <div class="page">
      <div class="topbar"><div class="topbar-row">${brandMarkHtml()}<div class="logo" style="margin-left:2px;">RIWAYAT</div></div></div>
      ${items.length ? `
      <div style="padding:14px 14px 0;"><button class="danger-btn" id="clearAllHistoryBtn">Hapus Semua Riwayat</button></div>
      <div>${items.map(x=>`
        <div class="list-row" data-id="${x.a.id}">
          <a href="javascript:void(0)" onclick="tryWatchEpisode('${x.a.id}', ${x.h.episodeNumber})" style="display:flex; gap:12px; flex:1; min-width:0; align-items:center;">
            <div class="list-row-poster"><img src="${esc(x.a.poster)}" onerror="this.src='https://placehold.co/400x560/181c25/565c6b?text=No+Image'"></div>
            <div class="list-row-body">
              <div class="list-row-title">${esc(x.a.title)}</div>
              <div class="list-row-sub">Episode ${x.h.episodeNumber} · ${timeAgo(x.h.timestamp)}</div>
            </div>
          </a>
          <button class="list-row-x" data-remove="${x.a.id}">${ICONS.trash}</button>
        </div>
      `).join('')}</div>` : `
      <div class="empty" style="margin-top:60px;">
        ${ICONS.film}
        <span class="big">Belum ada riwayat</span>
        <p>Anime yang kamu tonton akan muncul di sini agar mudah dilanjutkan.</p>
      </div>`}
    </div>
  `;
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      DB.removeHistoryForAnime(btn.dataset.remove);
      toast('Riwayat dihapus');
      renderHistory();
    });
  });
  const clearAllHistoryBtn = document.getElementById('clearAllHistoryBtn');
  if(clearAllHistoryBtn){
    clearAllHistoryBtn.addEventListener('click', ()=>{
      if(confirm('Hapus semua riwayat tontonan? Tindakan ini tidak bisa dibatalkan.')){
        DB.saveHistory([]);
        toast('Semua riwayat dihapus');
        renderHistory();
      }
    });
  }
}

/* ============================================================
   PWA — Service Worker Registration & Install Prompt
============================================================ */
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem('fearnime_pwa_dismissed')){
    const banner = document.getElementById('pwaInstallBanner');
    if(banner) banner.classList.add('show');
  }
});

document.getElementById('pwaInstallYes').addEventListener('click', async ()=>{
  const banner = document.getElementById('pwaInstallBanner');
  if(banner) banner.classList.remove('show');
  if(deferredPrompt){
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if(outcome === 'accepted'){
      toast('Fearnime berhasil dipasang!');
    }
    deferredPrompt = null;
  }
});

document.getElementById('pwaInstallNo').addEventListener('click', ()=>{
  const banner = document.getElementById('pwaInstallBanner');
  if(banner) banner.classList.remove('show');
  localStorage.setItem('fearnime_pwa_dismissed', '1');
  deferredPrompt = null;
});

window.addEventListener('appinstalled', ()=>{
  deferredPrompt = null;
  const banner = document.getElementById('pwaInstallBanner');
  if(banner) banner.classList.remove('show');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.warn('Service Worker gagal didaftarkan:', err);
    });
  });
}
