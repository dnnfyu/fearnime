<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fearnime — Nonton Anime Sub Indo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050f0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fearnime">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="20379886da0f0dc8f5dfff52612b9bd84a1c5789" content="20379886da0f0dc8f5dfff52612b9bd84a1c5789" />
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@6.9.0/dist/videojs-contrib-ads.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-vast-vpaid@2.8.0/bin/videojs_vast_vpaid.min.js"></script>
<style>
  :root{
    --bg:#0d0b1a;
    --app-max:860px;
    --app-gutter:14px;
    --bg-elevated:rgba(236,72,153,.10);
    --card:rgba(180,150,255,.07);
    --card-hover:rgba(236,72,153,.15);
    --border:rgba(130,110,190,.22);
    --text:#f1eefb;
    --text-dim:#b3a9d6;
    --text-faint:#6f6591;
    --accent:#ec4899;
    --accent-dim:#ec48992e;
    --accent-2:#f472b6;
    --ongoing:#f472b6;
    --ended:#544a72;
    --radius:10px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background-color:#0b0a17;
    background-image:
      radial-gradient(34% 26% at 86% 10%, rgba(236,72,153,.24) 0%, rgba(236,72,153,0) 72%),
      radial-gradient(26% 20% at 5% 96%, rgba(99,80,210,.20) 0%, rgba(99,80,210,0) 72%),
      radial-gradient(55% 42% at 50% -10%, rgba(45,30,85,.45) 0%, rgba(45,30,85,0) 68%);
    background-repeat:no-repeat;
    background-attachment:fixed, fixed, fixed;
    color:var(--text); font-family:var(--font-body); -webkit-tap-highlight-color:transparent;
  }
  .poster-wrap, .continue-card, .ep-item, .setting-item, .list-row-poster, .chip, .icon-btn,
  .q-btn, .nav-ep-btn, .genre-chip, .danger-btn, .mini-refresh, .search-input, .list-row-x,
  .back-btn-inline{
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  body{padding-bottom:100px; min-height:100vh;}
  #app, #announcementBar{ max-width:var(--app-max); margin:0 auto; position:relative; }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  ::-webkit-scrollbar{height:0; width:0;}
  .container{padding:0 14px;}

  /* ---------- Announcement bar ---------- */
  .announce-bar{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(236,72,153,.14); border-bottom:1px solid rgba(236,72,153,.3);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .announce-bar .ic{color:var(--accent); flex-shrink:0;}
  .announce-bar .ic svg{width:16px; height:16px;}
  .announce-marquee{flex:1; min-width:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .announce-track{display:inline-flex; align-items:center; gap:56px; white-space:nowrap; will-change:transform; animation:announceScroll linear infinite;}
  .announce-track span{font-size:12.5px; line-height:1.5; color:var(--text); white-space:nowrap;}
  @keyframes announceScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .announce-close{flex-shrink:0; color:var(--text-faint); width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .announce-close svg{width:14px; height:14px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:-webkit-sticky; position:sticky; top:0; z-index:45;
    padding:14px 14px 10px;
  }
  .topbar.hide-on-scroll{transform:translateY(-100%);}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .logo{
    font-family:var(--font-display);
    font-size:22px; letter-spacing:1px;
    color:var(--text);
  }
  .logo span{color:var(--accent);}

  /* ---------- Brand mark (icon + wordmark) ---------- */
  .brand-mark{display:flex; align-items:center; gap:9px;}
  .brand-mark-icon{width:32px; height:32px; flex-shrink:0; object-fit:contain; border-radius:9px;}
  .brand-mark-word{font-family:var(--font-display); font-size:25px; letter-spacing:1px; color:var(--text); line-height:1;}
  .brand-mark-word b{color:var(--accent); font-weight:400;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text-dim); flex-shrink:0;
  }
  .icon-btn svg{width:19px; height:19px;}
  .icon-btn:active{background:var(--card-hover);}
  .search-wrap{margin-top:10px; max-height:0; overflow:hidden; transition:max-height .22s ease;}
  .search-wrap.open{max-height:50px;}
  .search-input{
    width:100%; padding:10px 14px; border-radius:999px;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text); font-size:14px; font-family:var(--font-body);
  }
  .search-input:focus{outline:none; border-color:var(--accent);}
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- Section headers ---------- */
  .section{margin-top:22px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; padding:0 14px 10px; gap:10px;}
  .section-title{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .section-title .dot{width:6px; height:6px; border-radius:2px; background:var(--accent); display:inline-block;}
  .section-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-top:2px;}
  .section-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .see-all{font-size:11.5px; font-weight:700; color:var(--accent); font-family:var(--font-mono); white-space:nowrap;}
  .mini-refresh{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim); flex-shrink:0;
  }
  .mini-refresh svg{width:15px; height:15px;}
  .mini-refresh:active{background:var(--card-hover);}
  .mini-refresh.spin svg{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  /* ---------- Grids / scroll rows ---------- */
  .hscroll{display:flex; gap:12px; overflow-x:auto; padding:0 14px 4px; scroll-snap-type:x proximity; cursor:grab; user-select:none;}
  .hscroll.dragging{cursor:grabbing; scroll-snap-type:none;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:0 14px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:760px){.grid{grid-template-columns:repeat(5,1fr);}}

  /* ---------- Card ---------- */
  .card{width:118px; flex-shrink:0; scroll-snap-align:start;}
  .grid .card{width:auto;}
  .poster-wrap{position:relative; border-radius:var(--radius); overflow:hidden; height:0; padding-top:150%; aspect-ratio:2/3; background:var(--card); border:1px solid var(--border);}
  .poster-wrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .badge{position:absolute; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; font-family:var(--font-mono);}
  .badge-status{top:6px; left:6px; background:var(--ongoing); color:#06210f;}
  .badge-status.END{background:var(--ended); color:#fff;}
  .badge-rating{top:6px; right:6px; background:var(--accent); color:#fff; display:flex; align-items:center; gap:2px;}
  .star-ic{color:#ffd23d;}
  .ep-badge{bottom:6px; right:6px; background:rgba(0,0,0,.72); color:#fff; padding:2px 6px;}
  .card-title{font-size:12.5px; font-weight:700; margin-top:7px; line-height:1.3;}
  .card-type{font-size:10.5px; color:var(--text-faint); margin-top:2px; font-family:var(--font-mono); text-transform:uppercase;}

  /* ---------- Continue watching ---------- */
  .continue-card{width:150px; flex-shrink:0; scroll-snap-align:start; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .continue-thumb{position:relative; aspect-ratio:16/9; background:#000;}
  .continue-thumb img{width:100%; height:100%; object-fit:cover; opacity:.75; pointer-events:none;}
  .continue-play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .continue-play svg{width:28px; height:28px;}
  .continue-progress{position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,.2);}
  .continue-progress i{display:block; height:100%; background:var(--accent);}
  .continue-body{padding:9px 10px 11px;}
  .continue-title{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .continue-ep{font-size:11px; color:var(--text-dim); margin-top:3px; font-family:var(--font-mono);}

  /* ---------- Empty state ---------- */
  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty svg{width:52px; height:52px; margin-bottom:14px; opacity:.5;}
  .empty p{font-size:13.5px; line-height:1.6;}
  .empty .big{font-family:var(--font-display); font-size:20px; letter-spacing:.5px; color:var(--text-dim); margin-bottom:6px; display:block;}

  /* ---------- Sub page header (see all / history / favorites / settings) ---------- */
  .subpage-topbar{display:flex; align-items:center; gap:12px;}
  .subpage-topbar .back-btn-inline{
    width:36px; height:36px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .subpage-topbar .back-btn-inline svg{width:18px; height:18px;}
  .subpage-title{font-family:var(--font-display); font-size:22px; letter-spacing:.5px;}
  .subpage-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-top:-2px;}

  /* ---------- Detail page ---------- */
  .detail-hero{position:relative;}
  .detail-backdrop{width:100%; aspect-ratio:2/3; max-height:340px; object-fit:cover; filter:brightness(.5);}
  .detail-backdrop-fade{position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, var(--bg) 96%);}
  .back-btn{position:absolute; top:14px; left:14px; z-index:5; width:38px; height:38px; border-radius:50%; background:rgba(6,20,15,.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; border:1px solid var(--border);}
  .back-btn svg{width:19px; height:19px;}
  .fav-btn{position:absolute; top:14px; right:14px; z-index:5; width:38px; height:38px; border-radius:50%; background:rgba(6,20,15,.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; border:1px solid var(--border);}
  .fav-btn svg{width:19px; height:19px;}
  .fav-btn.active{color:var(--accent); border-color:var(--accent);}
  .detail-content{position:relative; margin-top:-64px; padding:0 14px;}
  .detail-poster-row{display:flex; gap:14px; align-items:flex-end;}
  .detail-poster{width:104px; flex-shrink:0; border-radius:var(--radius); overflow:hidden; border:2px solid var(--bg); box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .detail-poster img{aspect-ratio:2/3; object-fit:cover;}
  .detail-title{font-size:20px; font-weight:800; line-height:1.25; margin-bottom:6px;}
  .detail-meta-line{font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .status-pill{padding:1px 7px; border-radius:4px; font-size:10px; font-weight:800; background:var(--ongoing); color:#06210f;}
  .status-pill.Completed{background:var(--ended); color:#fff;}

  .genre-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px;}
  .genre-chip{font-size:11px; padding:4px 11px; border-radius:999px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim);}

  .synopsis{margin-top:16px; font-size:13.5px; line-height:1.65; color:var(--text-dim);}
  .synopsis.clamp{display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  .read-more{color:var(--accent); font-size:12.5px; font-weight:700; margin-top:8px; display:inline-block;}

  .play-btn{
    margin-top:18px; width:100%; padding:14px; border-radius:var(--radius);
    background:var(--accent); color:#fff; font-weight:800; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 20px var(--accent-dim);
  }
  .play-btn svg{width:19px; height:19px; flex-shrink:0;}
  .play-btn:active{transform:scale(.98);}

  .ep-list-head{display:flex; align-items:center; justify-content:space-between; margin-top:24px; margin-bottom:10px;}
  .ep-count{font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}
  .ep-list{display:flex; flex-direction:column; gap:8px; padding-bottom:20px;}
  .ep-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--border);
  }
  .ep-item:active{background:var(--card-hover);}
  .ep-item.watched{border-color:var(--accent-dim);}
  .ep-num{
    width:34px; height:34px; border-radius:8px; background:var(--bg-elevated); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--text-dim);
  }
  .ep-item.watched .ep-num{background:var(--accent); color:#fff;}
  .ep-info{flex:1; min-width:0;}
  .ep-name{font-size:13px; font-weight:700;}
  .ep-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}
  .ep-play-ic{color:var(--text-faint); flex-shrink:0;}
  .ep-play-ic svg{width:17px; height:17px; display:block;}

  /* ---------- Player page ---------- */
  .player-page{background:var(--bg);}
  .player-frame-wrap{width:100%; aspect-ratio:16/9; background:#000; position:relative;}
  @media(max-width:699px){
    .player-frame-wrap{ max-height:30vh; }
  }
  .player-frame-wrap iframe, .player-frame-wrap video{width:100%; height:100%; border:0;}
  .gesture-layer{position:absolute; top:0; left:0; right:0; bottom:44px; pointer-events:none;}
  .gesture-zone{position:absolute; top:0; bottom:0; width:50%; pointer-events:auto; touch-action:manipulation;}
  .gesture-zone.gesture-left{left:0;}
  .gesture-zone.gesture-right{right:0;}
  .gesture-flash{
    position:absolute; top:50%; left:25%; transform:translate(-50%,-50%) scale(.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff;
    font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
  }
  .gesture-flash svg{width:20px; height:20px;}
  .gesture-flash-right{left:auto; right:25%; transform:translate(50%,-50%) scale(.75);}
  .gesture-flash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .gesture-flash-right.show{opacity:1; transform:translate(50%,-50%) scale(1);}
  .gesture-speed-badge{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.65); color:#fff; padding:5px 14px; border-radius:999px;
    font-family:var(--font-mono); font-weight:800; font-size:12px; opacity:0;
    transition:opacity .2s ease; pointer-events:none;
  }
  .gesture-speed-badge.show{opacity:1;}
  .player-topbar{position:absolute; top:0; left:0; right:0; padding:12px; display:flex; align-items:center; gap:10px; background:linear-gradient(180deg, rgba(0,0,0,.75), transparent); z-index:5;}
  .player-topbar .back-btn{position:static; background:rgba(0,0,0,.5);}
  .player-title-mini{font-size:12.5px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .player-body{padding:16px 14px;}
  .quality-row{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .quality-label{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-right:2px;}
  .q-btn{padding:7px 16px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-dim); font-family:var(--font-mono);}
  .q-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .player-anime-title{font-size:16px; font-weight:800;}
  .player-ep-title{font-size:12.5px; color:var(--text-dim); margin-top:4px; font-family:var(--font-mono);}
  .nav-ep-row{display:flex; gap:10px; margin-top:16px;}
  .nav-ep-btn{flex:1; padding:12px; border-radius:var(--radius); background:var(--bg-elevated); border:1px solid var(--border); font-size:12.5px; font-weight:700; text-align:center; color:var(--text-dim);}
  .nav-ep-btn.disabled{opacity:.35; pointer-events:none;}
  .nav-ep-btn.next-highlight{background:var(--accent); color:#fff; border-color:var(--accent);}
  .mini-eplist-head{margin-top:22px; margin-bottom:10px; font-size:13.5px; font-weight:800;}

  /* ---------- Custom Video Player ---------- */
  .cp-root{position:absolute; inset:0; background:#000; overflow:hidden; touch-action:manipulation;}
  .cp-root video{width:100%; height:100%; object-fit:contain; background:#000; display:block;}
  .cp-center-play{
    display:none;
  }
  .cp-spinner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:var(--accent);
    animation:cpSpin .8s linear infinite; opacity:0; pointer-events:none; z-index:6; transition:opacity .15s ease;
  }
  .cp-spinner.show{opacity:1;}
  @keyframes cpSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .cp-gesture-layer{position:absolute; inset:0; z-index:4;}
  .cp-gesture-zone{position:absolute; top:0; bottom:0; width:50%; touch-action:none;}
  .cp-gesture-left{left:0;}
  .cp-gesture-right{right:0;}

  .cp-flash{
    position:absolute; top:50%; left:25%; transform:translate(-50%,-50%) scale(.7);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:58px; height:58px; border-radius:50%; background:rgba(0,0,0,.62); color:#fff;
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    opacity:0; transition:opacity .22s ease, transform .22s ease; pointer-events:none; z-index:5;
  }
  .cp-flash svg{width:19px; height:19px;}
  .cp-flash-right{left:auto; right:25%; transform:translate(50%,-50%) scale(.7);}
  .cp-flash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .cp-flash-right.show{opacity:1; transform:translate(50%,-50%) scale(1);}

  .cp-speed-badge{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.65); color:#fff; padding:6px 14px; border-radius:999px;
    font-family:var(--font-mono); font-weight:800; font-size:12px; opacity:0;
    transition:opacity .2s ease; pointer-events:none; z-index:7;
  }
  .cp-speed-badge svg{width:13px; height:13px;}
  .cp-speed-badge.show{opacity:1;}

  .cp-controls{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    opacity:0; transition:opacity .25s ease;
  }
  .cp-controls.show{opacity:1;}
  .cp-controls.show .cp-top-bar, .cp-controls.show .cp-bottom-bar{pointer-events:auto;}

  .cp-top-bar{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:linear-gradient(180deg, rgba(0,0,0,.7), transparent);
  }
  .cp-title{flex:1; min-width:0; text-align:center; font-size:12.5px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cp-top-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .cp-icon-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.14); color:#fff; flex-shrink:0;
  }
  .cp-icon-btn svg{width:17px; height:17px; display:block;}
  .cp-icon-btn:active{background:rgba(255,255,255,.18);}
  .cp-icon-btn.disabled{opacity:.35; pointer-events:none;}
  .cp-quality-indicator{
    position:absolute; top:14px; right:14px; z-index:6;
    background:rgba(0,0,0,.55); color:#fff; font-size:11px; font-weight:800;
    padding:4px 10px; border-radius:6px; font-family:var(--font-mono);
    opacity:0; transition:opacity .4s ease; pointer-events:none;
  }
  .cp-quality-indicator.show{opacity:1;}

  .cp-bottom-bar{
    padding:8px 12px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,.82), transparent);
  }
  .cp-seek-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .cp-time{font-family:var(--font-mono); font-size:11px; color:#fff; flex-shrink:0; min-width:34px;}
  .cp-time:last-child{text-align:right;}
  .cp-seek-track{
    position:relative; flex:1; height:16px; display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .cp-seek-track::before{
    content:''; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    height:3px; border-radius:2px; background:rgba(255,255,255,.25);
  }
  .cp-seek-buffered{position:absolute; left:0; top:50%; transform:translateY(-50%); height:3px; border-radius:2px; background:rgba(255,255,255,.4); width:0%;}
  .cp-seek-played{position:absolute; left:0; top:50%; transform:translateY(-50%); height:3px; border-radius:2px; background:var(--accent); width:0%;}
  .cp-seek-thumb{
    position:absolute; top:50%; left:0%; width:12px; height:12px; border-radius:50%; background:var(--accent);
    transform:translate(-50%,-50%); box-shadow:0 0 0 4px rgba(236,72,153,.22);
  }
  .cp-actions-row{display:flex; align-items:center; justify-content:center; gap:24px;}
  .cp-mini-btn{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:#fff; flex-shrink:0;
  }
  .cp-mini-btn svg{width:19px; height:19px; display:block;}
  .cp-mini-btn:active{opacity:.55;}
  .cp-play-round{
    width:48px; height:48px; border-radius:50%; background:#fff; color:#111;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none;
  }
  .cp-play-round svg{width:22px; height:22px; display:block;}
  .cp-play-round:active{transform:scale(.94);}
  .cp-quality-pill{
    padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
    color:#fff; font-size:11.5px; font-weight:800; font-family:var(--font-mono); flex-shrink:0;
  }
  .cp-quality-pill:active{background:rgba(255,255,255,.26);}

  /* Player di HP dibikin lebih ringkas: tombol & ikon dikecilin biar proporsional
     sama kotak video yang sekarang lebih pendek (lihat .player-frame-wrap di atas). */
  @media(max-width:699px){
    .cp-top-bar{padding:8px 10px;}
    .cp-icon-btn{width:28px; height:28px;}
    .cp-icon-btn svg{width:14px; height:14px;}
    .cp-bottom-bar{padding:5px 10px 8px;}
    .cp-seek-row{margin-bottom:5px; gap:7px;}
    .cp-time{font-size:10px; min-width:28px;}
    .cp-actions-row{gap:14px;}
    .cp-mini-btn{width:24px; height:24px;}
    .cp-mini-btn svg{width:15px; height:15px;}
    .cp-play-round{width:36px; height:36px;}
    .cp-play-round svg{width:17px; height:17px;}
    .cp-quality-pill{padding:4px 10px; font-size:10.5px;}
    .cp-center-play{width:48px; height:48px;}
  }

  .cp-sheet-overlay{
    position:absolute; inset:0; z-index:20; background:rgba(2,8,6,.42); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .cp-sheet-overlay.show{opacity:1; pointer-events:auto;}
  .cp-sheet{
    width:100%; max-height:78%; margin:0 auto; background:rgba(22,15,43,.78); border:1px solid var(--border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-radius:16px 16px 0 0; padding:14px 0 6px; display:flex; flex-direction:column;
    transform:translateY(12px); transition:transform .22s ease;
  }
  .cp-sheet-overlay.show .cp-sheet{transform:translateY(0);}
  .cp-sheet-narrow{max-height:60%;}
  .cp-sheet-head{display:flex; align-items:center; justify-content:space-between; padding:0 16px 12px; border-bottom:1px solid var(--border);}
  .cp-sheet-head-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; color:#fff;}
  .cp-sheet-head-title svg{width:16px; height:16px; color:var(--accent);}
  .cp-sheet-list{overflow-y:auto; padding:10px 12px 4px;}
  .cp-sheet-item{
    width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px;
    background:rgba(255,255,255,.05); border:1px solid var(--border); margin-bottom:8px; color:#fff;
  }
  .cp-sheet-item:active{background:rgba(255,255,255,.1);}
  .cp-sheet-item.active{border-color:var(--accent); background:rgba(236,72,153,.14);}
  .cp-sheet-item svg{width:15px; height:15px; flex-shrink:0; color:var(--text-faint);}
  .cp-sheet-num{
    width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,.08); display:flex; align-items:center;
    justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px; flex-shrink:0;
  }
  .cp-sheet-item.active .cp-sheet-num{background:var(--accent); color:#fff;}
  .cp-sheet-label{flex:1; text-align:left; font-size:13px; font-weight:700;}
  .cp-sheet-item.active svg{color:var(--accent);}

  @media(orientation:landscape) and (max-height:520px){
    .cp-top-bar{padding:6px 10px;}
    .cp-icon-btn{width:26px; height:26px;}
    .cp-icon-btn svg{width:13px; height:13px;}
    .cp-bottom-bar{padding:4px 10px 8px;}
    .cp-seek-row{gap:6px; margin-bottom:5px;}
    .cp-time{font-size:10px; min-width:26px;}
    .cp-actions-row{gap:12px;}
    .cp-mini-btn{width:22px; height:22px;}
    .cp-mini-btn svg{width:13px; height:13px;}
    .cp-play-round{width:32px; height:32px;}
    .cp-play-round svg{width:15px; height:15px;}
    .cp-quality-pill{padding:3px 9px; font-size:10px;}
  }

  /* ---------- History / Favorites list rows ---------- */
  .list-row{display:flex; gap:12px; padding:11px 14px; align-items:center; border-bottom:1px solid var(--border); background:var(--card);}
  .list-row-poster{width:56px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; flex-shrink:0; background:var(--card);}
  .list-row-poster img{width:100%; height:100%; object-fit:cover;}
  .list-row-body{flex:1; min-width:0;}
  .list-row-title{font-size:13.5px; font-weight:700; line-height:1.35;}
  .list-row-sub{font-size:11.5px; color:var(--text-faint); margin-top:3px; font-family:var(--font-mono);}
  .list-row-x{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
  .list-row-x svg{width:16px; height:16px;}
  .list-row-x:active{background:var(--bg-elevated);}

  /* ---------- Settings ---------- */
  .settings-block{padding:18px 14px;}
  .setting-item{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .setting-item p{font-size:12px; color:var(--text-faint); margin-top:3px; font-weight:400;}
  .setting-item .label{font-size:14px; font-weight:700;}
  .danger-btn{padding:9px 16px; border-radius:8px; background:var(--accent-dim); color:var(--accent); font-weight:700; font-size:12.5px; border:1px solid var(--accent);}
  .about-box{margin-top:16px; text-align:center; padding:20px 0; color:var(--text-faint); font-size:11.5px; font-family:var(--font-mono); line-height:1.8;}

  .genre-chip-row{display:flex; gap:9px; overflow-x:auto; padding:0 14px 4px; cursor:grab; user-select:none;}
  .genre-chip-row.dragging{cursor:grabbing;}
  .genre-pill-btn{
    flex-shrink:0; scroll-snap-align:start; white-space:nowrap;
    padding:9px 18px; border-radius:999px; font-size:12.5px; font-weight:700;
    background:var(--card); border:1px solid var(--border); color:var(--text-dim);
  }
  .genre-pill-btn:active{background:var(--card-hover); color:var(--text);}

  /* ---------- Iklan & Tiket ---------- */
  .ad-banner-wrap{margin:14px 14px 0; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--card); min-height:70px;}
  .ad-banner-wrap iframe{width:100%; height:90px; border:0; display:block;}
  .ad-native-label{font-size:10px; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1px; padding:0 14px 6px;}
  .ad-native-wrap{margin:0 14px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--card); min-height:110px;}
  .ad-native-wrap iframe{width:100%; height:140px; border:0; display:block;}

  .ticket-badge{
    position:fixed; left:14px; bottom:92px; z-index:80;
    display:flex; align-items:center; gap:7px;
    background:linear-gradient(135deg, #7c5cff, #5b3df0);
    color:#fff; font-weight:800; font-size:13px; font-family:var(--font-body);
    padding:10px 18px; border-radius:999px;
    box-shadow:0 10px 24px rgba(92,61,240,.45);
  }
  .ticket-badge.no-nav{bottom:20px;}
  .ticket-badge:active{transform:scale(.96);}

  .ad-gate-overlay{
    position:fixed; inset:0; z-index:300; background:rgba(2,8,6,.84); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .ad-gate-box{width:100%; max-width:360px; background:#160f2b; border:1px solid var(--border); border-radius:14px; padding:20px; position:relative; max-height:88vh; overflow-y:auto;}
  .ad-gate-close{position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim); font-size:16px;}
  .ad-gate-title{font-size:15px; font-weight:800; margin-bottom:8px;}
  .ad-gate-sub{font-size:12.5px; color:var(--text-dim); line-height:1.6; margin-bottom:14px;}
  .ad-frame-wrap{width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; margin-bottom:14px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:11.5px; text-align:center; padding:14px;}
  .ad-frame-wrap iframe{width:100%; height:100%; border:0;}
  .ad-gate-actions{display:flex; gap:10px;}
  .ad-video-wrap{width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; margin-bottom:14px; position:relative;}
  .ad-video-wrap .video-js{width:100%; height:100%;}
  .ad-gate-status-badge{position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,.65); color:#fff; font-size:11px; padding:4px 9px; border-radius:999px; font-family:var(--font-mono); z-index:2; pointer-events:none;}

  /* ---------- Toast ---------- */
  .toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--card); border:1px solid var(--border); padding:11px 20px; border-radius:999px; font-size:12.5px; font-weight:600; z-index:200; opacity:0; transition:all .25s ease; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; right:auto; z-index:50;
    width:100%; max-width:var(--app-max);
    transform:translateX(-50%);
    height:68px;
  }
  .bottom-nav-bar{
    position:absolute; inset:0;
    background:rgba(24,19,42,.42);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.09);
    border-radius:24px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
  }
  .bottom-nav-items{
    position:relative; height:100%; display:flex; align-items:center;
    padding:0 4px;
  }
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 4px; color:rgba(233,245,239,.62);}
  .nav-btn .nav-icon{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; transition:background .18s ease, color .18s ease;}
  .nav-btn .nav-icon svg{width:20px; height:20px;}
  .nav-btn .nav-label{font-size:10px; font-weight:700; letter-spacing:.2px; transition:color .18s ease;}
  .nav-btn.active{color:#fff;}
  .nav-btn.active:not(.home-btn) .nav-icon{background:rgba(236,72,153,.22);}

  .nav-btn-circle{
    width:38px; height:38px; border-radius:50%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    margin-top:0;
    box-shadow:none;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .nav-btn-circle svg{width:20px; height:20px; color:inherit;}
  .nav-btn.home-btn.active .nav-btn-circle{
    background:rgba(236,72,153,.22);
    box-shadow:none;
  }
  @keyframes navIconPop{
    0%{transform:scale(1) rotate(0);}
    45%{transform:scale(1.22) rotate(-7deg);}
    75%{transform:scale(.93) rotate(4deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .nav-icon.pop, .nav-btn-circle.pop{animation:navIconPop .42s cubic-bezier(.34,1.56,.64,1);}

  .page{animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Splash / loading screen ---------- */
  .splash-screen{
    position:fixed; inset:0; z-index:999;
    background:#080612;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .splash-screen.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-logo{width:180px; height:auto; object-fit:contain;}
  .splash-word{font-family:var(--font-display); font-size:30px; letter-spacing:1.5px; color:var(--text); margin-top:6px;}
  .splash-word b{color:var(--accent); font-weight:400;}
  .splash-tagline{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:.5px;}
  .splash-loader{position:absolute; bottom:56px; display:flex; gap:6px;}
  .splash-loader span{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.3; animation:splashDot 1.1s ease-in-out infinite;}
  .splash-loader span:nth-child(2){animation-delay:.15s;}
  .splash-loader span:nth-child(3){animation-delay:.3s;}
  @keyframes splashDot{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-5px);}}

  /* ---------- Google Auth / Profil (baru, tidak mengubah yang lama) ---------- */
  .auth-block{padding:0 14px; margin-bottom:18px;}
  .auth-login-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 18px; text-align:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .auth-login-card .auth-login-title{font-family:var(--font-display); font-size:19px; letter-spacing:.5px; color:var(--text); margin-bottom:4px;}
  .auth-login-card .auth-login-sub{font-size:12px; color:var(--text-faint); margin-bottom:16px; line-height:1.5;}
  #googleSignInBtnWrap{display:flex; justify-content:center;}
  .auth-profile-card{
    background:linear-gradient(160deg, rgba(236,72,153,.12), rgba(180,150,255,.06));
    border:1px solid var(--border); border-radius:14px; padding:0; overflow:hidden;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .auth-profile-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border);}
  .auth-profile-head-title{font-size:12px; font-weight:800; color:var(--text-dim); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1px;}
  .auth-profile-head-actions{display:flex; gap:8px;}
  .auth-chip-btn{
    padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:700;
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim);
  }
  .auth-chip-btn:active{background:var(--card-hover);}
  .auth-chip-btn.accent{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .auth-profile-body{display:flex; align-items:center; gap:14px; padding:18px 16px;}
  .auth-avatar{width:58px; height:58px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); flex-shrink:0; background:var(--bg-elevated);}
  .auth-profile-name{font-size:16px; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .auth-profile-email{font-size:12px; color:var(--text-faint); font-family:var(--font-mono); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .auth-profile-foot{display:flex; justify-content:flex-end; padding:16px;}
  .auth-logout-btn{
    padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:800;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.5); color:#f87171;
  }
  .auth-logout-btn:active{background:rgba(239,68,68,.22);}

  /* ---------- Edit Profil ---------- */
  .edit-profile-wrap{padding:16px 14px 30px;}
  .edit-profile-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:26px 18px 22px; text-align:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .edit-profile-avatar-wrap{position:relative; width:92px; height:92px; margin:0 auto;}
  .edit-profile-avatar-fallback{
    position:absolute; inset:0; border-radius:50%; background:linear-gradient(150deg, #d6338f, #7a1fa0);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px; font-weight:800;
    font-family:var(--font-body); text-transform:lowercase;
  }
  .edit-profile-avatar{position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; opacity:0; transition:opacity .2s ease;}
  .edit-profile-photo-btn{
    display:inline-flex; align-items:center; gap:7px; margin-top:14px; padding:8px 16px; border-radius:999px;
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .edit-profile-photo-btn svg{width:14px; height:14px;}
  .edit-profile-photo-btn:active{background:var(--card-hover);}
  .edit-profile-card .field{text-align:left;}
  .edit-profile-card .field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
  .edit-profile-card .field input{
    width:100%; padding:12px 14px; border-radius:10px; background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text); font-size:14px; font-family:var(--font-body);
  }
  .edit-profile-card .field input:focus{outline:none; border-color:var(--accent);}
  .edit-profile-save-btn{
    width:100%; margin-top:16px; padding:15px; border-radius:var(--radius);
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); font-weight:800; font-size:14px;
  }
  .edit-profile-save-btn:active{background:var(--card-hover);}

  /* ---------- PWA Install Prompt ---------- */
  .pwa-install-banner{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%) translateY(20px);
    z-index:90; max-width:var(--app-max); width:calc(100% - 28px);
    background:linear-gradient(135deg, #160f2b, #241a45);
    border:1px solid var(--accent); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none;
  }
  .pwa-install-banner.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .pwa-install-icon{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--accent-dim); display:flex; align-items:center; justify-content:center; color:var(--accent);
  }
  .pwa-install-icon svg{width:24px; height:24px;}
  .pwa-install-text{flex:1; min-width:0;}
  .pwa-install-title{font-size:13.5px; font-weight:800; color:var(--text);}
  .pwa-install-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .pwa-install-actions{display:flex; gap:8px; flex-shrink:0;}
  .pwa-install-yes{
    padding:9px 18px; border-radius:8px; background:var(--accent); color:#fff;
    font-weight:800; font-size:12.5px; white-space:nowrap;
  }
  .pwa-install-yes:active{transform:scale(.96);}
  .pwa-install-no{
    padding:9px 14px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border);

<script>
/* ============================================================
   FEARNIME — data layer (localStorage demo)
============================================================ */
const DB_KEY_ANIMES = 'fearnime_animes';
const DB_KEY_HISTORY = 'fearnime_history';
const DB_KEY_FAVORITES = 'fearnime_favorites';
const DB_KEY_ANNOUNCEMENT = 'fearnime_announcement';
const DB_KEY_ANNOUNCEMENT_DISMISSED = 'fearnime_announcement_dismissed';
const DB_KEY_SETTINGS = 'fearnime_settings';
const DB_KEY_AD_SETTINGS = 'fearnime_ad_settings';
const DB_KEY_AD_SLOTS = 'fearnime_ad_slots';
const DB_KEY_TICKETS = 'fearnime_tickets';
const DB_KEY_TICKET_EVENT = 'fearnime_ticket_event';
const DB_KEY_CLAIMED_EVENTS = 'fearnime_claimed_events';
const DB_KEY_GENRES = 'fearnime_genres';
const DB_KEY_RESOLUTIONS = 'fearnime_resolutions';
const SEED_RESOLUTIONS = ['360p','480p','720p','1080p'];
const DB_KEY_USER = 'fearnime_user';
const GOOGLE_CLIENT_ID = '427132462258-6n8i6j3j0f97lts084fp5hvsrrpjj2vp.apps.googleusercontent.com';
const MAX_TICKETS = 999;
const SEED_GENRES = ['Action','Adventure','Comedy','Demons','Drama','Ecchi','Fantasy','Game','Harem','Historical'];
const MAX_HISTORY_ITEMS = 200;
function safeSetItem(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.warn('Penyimpanan lokal penuh, gagal menyimpan:', key); return false; }
}

const API_BASE = 'https://fearnime-api.prtamadnn.workers.dev';

const CACHE = {
  animes: [],
  genres: [],
  resolutions: [...SEED_RESOLUTIONS],
  settings: {logoUrl:'', splashLogoUrl:'', splashTagline:'STREAMING SEREM · SUB INDO'},
  adSettings: {adGateEnabled:false, ticketsPerAd:8, ticketCostPerEpisode:1, vastTagUrl:'', videoPendekUrl:''},
  adSlots: [],
  announcement: {enabled:false, text:''},
  ticketEvent: null,
  loaded: false
};
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('API ' + path + ' -> ' + res.status);
  return res.json();
}
async function loadRemoteData(){
  try{
    const [animes, genres, resolutions, settings, adSettings, adSlots, announcement, ticketEvent] = await Promise.all([
      apiGet('/api/animes'),
      apiGet('/api/genres'),
      apiGet('/api/resolutions'),
      apiGet('/api/settings'),
      apiGet('/api/ad-settings'),
      apiGet('/api/ad-slots'),
      apiGet('/api/announcement'),
      apiGet('/api/ticket-event')
    ]);
    CACHE.animes = animes || [];
    CACHE.genres = genres && genres.length ? genres : [...SEED_GENRES];
    CACHE.resolutions = resolutions && resolutions.length ? resolutions : [...SEED_RESOLUTIONS];
    if(settings) CACHE.settings = Object.assign({}, CACHE.settings, settings);
    if(adSettings) CACHE.adSettings = Object.assign({}, CACHE.adSettings, adSettings);
    CACHE.adSlots = adSlots || [];
    if(announcement) CACHE.announcement = announcement;
    CACHE.ticketEvent = ticketEvent || null;
  }catch(e){
    console.warn('Gagal memuat data dari API, situs jalan dengan data kosong:', e);
  }
  CACHE.loaded = true;
}

const DB = {
  getAnimes(){ return CACHE.animes; },
  getAnime(id){ return CACHE.animes.find(a=>a.id===id) || null; },
  getUserKey(){
    const u = this.getUser();
    return (u && u.email) ? u.email.trim().toLowerCase() : null;
  },
  getHistory(){
    const key = this.getUserKey();
    if(!key) return [];
    try{ return JSON.parse(localStorage.getItem(DB_KEY_HISTORY + ':' + key)) || []; }catch(e){ return []; }
  },
  saveHistory(list){
    const key = this.getUserKey();
    if(!key) return;
    const trimmed = list.slice(0, MAX_HISTORY_ITEMS);
    const ok = safeSetItem(DB_KEY_HISTORY + ':' + key, JSON.stringify(trimmed));
    if(!ok){
      safeSetItem(DB_KEY_HISTORY + ':' + key, JSON.stringify(trimmed.slice(0, Math.floor(trimmed.length/2))));
    }
  },
  addHistory(animeId, episodeNumber){
    if(!this.getUserKey()) return;
    let list = this.getHistory();
    list = list.filter(h=>!(h.animeId===animeId && h.episodeNumber===episodeNumber));
    list.unshift({animeId, episodeNumber, timestamp:Date.now()});
    this.saveHistory(list);
  },
  removeHistoryForAnime(animeId){
    if(!this.getUserKey()) return;
    let list = this.getHistory().filter(h=>h.animeId!==animeId);
    this.saveHistory(list);
  },
  getFavorites(){
    const key = this.getUserKey();
    if(!key) return [];
    try{ return JSON.parse(localStorage.getItem(DB_KEY_FAVORITES + ':' + key)) || []; }catch(e){ return []; }
  },
  saveFavorites(list){
    const key = this.getUserKey();
    if(!key) return;
    safeSetItem(DB_KEY_FAVORITES + ':' + key, JSON.stringify(list));
  },
  toggleFavorite(animeId){
    if(!this.getUserKey()) return null;
    let list = this.getFavorites();
    const idx = list.indexOf(animeId);
    if(idx>-1){ list.splice(idx,1); } else { list.unshift(animeId); }
    this.saveFavorites(list);
    return idx===-1;
  },
  isFavorite(animeId){
    if(!this.getUserKey()) return false;
    return this.getFavorites().includes(animeId);
  },
  clearCache(){
    const key = this.getUserKey();
    if(key){
      localStorage.removeItem(DB_KEY_HISTORY + ':' + key);
      localStorage.removeItem(DB_KEY_FAVORITES + ':' + key);
    }
  },
  getAnnouncement(){ return CACHE.announcement; },
  getSettings(){ return CACHE.settings; },
  getAdSettings(){ return CACHE.adSettings; },
  getAdSlots(){ return CACHE.adSlots; },
  getTickets(){
    const v = parseInt(localStorage.getItem(DB_KEY_TICKETS));
    return isNaN(v) ? 0 : Math.max(0, Math.min(MAX_TICKETS, v));
  },
  setTickets(v){
    const clamped = Math.max(0, Math.min(MAX_TICKETS, Math.round(v)||0));
    safeSetItem(DB_KEY_TICKETS, String(clamped));
    return clamped;
  },
  addTickets(delta){
    return this.setTickets(this.getTickets() + delta);
  },
  getTicketEvent(){ return CACHE.ticketEvent; },
  getGenres(){ return CACHE.genres; },
  getResolutions(){ return CACHE.resolutions; },
  getUser(){
    try{ return JSON.parse(localStorage.getItem(DB_KEY_USER)) || null; }
    catch(e){ return null; }
  },
  saveUser(user){ return safeSetItem(DB_KEY_USER, JSON.stringify(user)); },
  clearUser(){ localStorage.removeItem(DB_KEY_USER); }
};

/* ============================================================
   Helpers
============================================================ */
function latestEpisodeNumber(anime){
  if(!anime.episodes || !anime.episodes.length) return 0;
  return Math.max(...anime.episodes.map(e=>e.number));
}
function esc(str){
  const d = document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML;
}
function escAttr(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function formatTanggal(ts){
  const bulanSingkat = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date(ts);
  return `${d.getDate()} ${bulanSingkat[d.getMonth()]} ${d.getFullYear()}`;
}
function driveIdFromUrl(url){
  if(!url) return null;
  let u;
  try{ u = new URL(url); }catch(e){ return null; }
  const host = u.hostname.toLowerCase();
  const isDriveHost = host==='drive.google.com' || host.endsWith('.drive.google.com') ||
                       host==='docs.google.com' || host.endsWith('.docs.google.com');
  if(!isDriveHost) return null;
  const m1 = u.pathname.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m1) return m1[1];
  const idParam = u.searchParams.get('id');
  if(idParam) return idParam;
  return null;
}
const IFRAME_ONLY_HOSTS = ['youtube.com','youtu.be','vimeo.com','dailymotion.com','streamable.com','ok.ru'];
function isDirectVideo(url){
  if(!url) return false;
  if(driveIdFromUrl(url)) return false;
  try{
    const host = new URL(url).hostname.toLowerCase();
    // Host yang memang cuma bisa diputar lewat iframe embed resmi mereka (bukan file video langsung)
    if(IFRAME_ONLY_HOSTS.some(h=> host===h || host.endsWith('.'+h))) return false;
  }catch(e){}
  // Selain Google Drive & platform embed di atas, anggap sebagai video langsung
  // (mencakup: link .mp4/.webm/.m3u8, link Worker proxy custom domain, atau path tanpa ekstensi seperti /api/video/xxxx)
  return true;
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function makeDraggable(el){
  if(!el) return;
  let isDown=false, startX=0, scrollStart=0, moved=false;
  el.addEventListener('mousedown', e=>{
    isDown=true; moved=false; el.classList.add('dragging');
    startX = e.pageX; scrollStart = el.scrollLeft;
  });
  window.addEventListener('mouseup', ()=>{ isDown=false; el.classList.remove('dragging'); });
  window.addEventListener('mousemove', e=>{
    if(!isDown) return;
    const dx = e.pageX - startX;
    if(Math.abs(dx)>4) moved=true;
    el.scrollLeft = scrollStart - dx;
  });
  el.addEventListener('click', e=>{
    if(moved){ e.preventDefault(); e.stopPropagation(); }
  }, true);

/* ============================================================
   Google Authentication (Google Identity Services) — baru
============================================================ */
function decodeJwtResponse(token){
  try{
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c=>
      '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(jsonPayload);
  }catch(e){ return null; }
}
function handleCredentialResponse(response){
  const payload = decodeJwtResponse(response.credential);
  if(!payload){ toast('Gagal login dengan Google'); return; }
  const user = {
    name: payload.name || '',
    email: payload.email || '',
    picture: payload.picture || '',
    loggedInAt: Date.now()
  };
  DB.saveUser(user);
  toast(`Halo, ${user.name.split(' ')[0] || 'pengguna'}!`);
  renderAuthUI();
}
function initGoogleAuth(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: false
  });
  const btnWrap = document.getElementById('googleSignInBtnWrap');
  if(btnWrap && !DB.getUser()){
    btnWrap.innerHTML = '';
    google.accounts.id.renderButton(btnWrap, { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', width:260 });
    google.accounts.id.prompt();
  }
}
function logout(){
  DB.clearUser();
  if(window.google && google.accounts && google.accounts.id){
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  toast('Berhasil logout');
  renderAuthUI();
}
function renderAuthUI(){
  const mount = document.getElementById('authBlock');
  if(!mount) return;
  const user = DB.getUser();
  if(!user){
    mount.innerHTML = `
      <div class="auth-login-card">
        <div class="auth-login-title">Masuk ke Fearnime</div>
        <div class="auth-login-sub">Login dengan Google untuk menyimpan preferensi kamu.</div>
        <div id="googleSignInBtnWrap"></div>
      </div>
    `;
    initGoogleAuth();
  } else {
    mount.innerHTML = `
      <div class="auth-profile-card">
        <div class="auth-profile-head">
          <div class="auth-profile-head-title">Akun Saya</div>
          <div class="auth-profile-head-actions">
            <button class="auth-chip-btn accent" id="editProfileBtn">Edit</button>
          </div>
        </div>
        <div class="auth-profile-body">
          <img class="auth-avatar" src="${esc(user.picture)}" alt="${esc(user.name)}" onerror="this.style.opacity=0">
          <div style="min-width:0;">
            <div class="auth-profile-name">${esc(user.name)}</div>
            <div class="auth-profile-email">${esc(user.email)}</div>
          </div>
        </div>
        <div class="auth-profile-foot">
          <button class="auth-logout-btn" id="logoutBtn">Log Out</button>
        </div>
      </div>
    `;
    const editBtn = document.getElementById('editProfileBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if(editBtn) editBtn.addEventListener('click', ()=> navigate('/edit-profile'));
    if(logoutBtn) logoutBtn.addEventListener('click', logout);
  }
}

/* ---------- EDIT PROFIL ---------- */
let editProfilePicDraft = null;
function renderEditProfile(){
  const user = DB.getUser();
  if(!user){ navigate('/settings'); return; }
  editProfilePicDraft = user.picture || '';
  const initial = (user.name||'?').trim().charAt(0) || '?';

  app.innerHTML = `
    <div class="page">
      <div class="topbar">
        <div class="subpage-topbar">
          <button class="back-btn-inline" id="backBtn">${ICONS.back}</button>
          <div>
            <div class="subpage-title">Edit Profil</div>
          </div>
        </div>
      </div>
      <div class="edit-profile-wrap">
        <div class="edit-profile-card">
          <div class="edit-profile-avatar-wrap">
            <div class="edit-profile-avatar-fallback">${esc(initial)}</div>
            <img class="edit-profile-avatar" id="editAvatarImg" src="${esc(editProfilePicDraft)}" onerror="this.style.opacity=0" onload="this.style.opacity=1">
          </div>
          <label class="edit-profile-photo-btn" id="changePhotoBtn">
            ${ICONS.edit} Ganti Foto Profil
            <input type="file" accept="image/*" id="photoFileInput" style="display:none;">
          </label>
          <div class="field" style="margin-top:22px;">
            <label>Nama</label>
            <input id="edit_name" value="${esc(user.name)}" placeholder="Nama kamu">
          </div>
        </div>
        <button class="edit-profile-save-btn" id="saveProfileBtn">Simpan Perubahan</button>
      </div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=> navigate('/settings'));
  const fileInput = document.getElementById('photoFileInput');
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      editProfilePicDraft = reader.result;
      const img = document.getElementById('editAvatarImg');
      img.src = editProfilePicDraft;
      img.style.opacity = 1;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('saveProfileBtn').addEventListener('click', ()=>{
    const name = document.getElementById('edit_name').value.trim();
    if(!name){ toast('Nama tidak boleh kosong'); return; }
    const cur = DB.getUser();
    if(!cur){ navigate('/settings'); return; }
    cur.name = name;
    cur.picture = editProfilePicDraft || '';
    DB.saveUser(cur);
    toast('Profil disimpan');
    navigate('/settings');
  });
}

/* [PATCH ad-ticket-vast — bagian 1/2, lanjut besok: openAdGate/renderAdGateModal
   masih pakai versi lama, belum diganti ke Video.js VAST/VPAID] */
function tryWatchEpisode(animeId, epNumber){
  const settings = DB.getAdSettings();
  if(!settings.adGateEnabled){
    maybeShowInterstitial(animeId, epNumber);
    return;
  }
  const cost = settings.ticketCostPerEpisode || 1;
  const balance = DB.getTickets();
  if(balance < cost){
    // Tiket tidak cukup (termasuk 0) -> wajib nonton iklan dulu
    openAdGate(animeId, epNumber, 'unlock');
    return;
  }
  DB.addTickets(-cost);
  maybeShowInterstitial(animeId, epNumber);
}
function maybeShowInterstitial(animeId, epNumber){
  const slot = DB.getAdSlots().find(s=>s.enabled && s.type==='Interstitial');
  if(!slot){ navigate(`/play/${animeId}/${epNumber}`); return; }
  openInterstitial(slot, animeId, epNumber);
}
function openInterstitial(slot, animeId, epNumber){
  const overlay = document.getElementById('adGateOverlay');
  const content = document.getElementById('adGateContent');
  content.innerHTML = `
    <div class="ad-gate-title">Iklan</div>
    <div class="ad-gate-sub">Video akan diputar setelah iklan selesai.</div>
    <div class="ad-frame-wrap">${slot.code ? `<iframe srcdoc="${escAttr(slot.code)}"></iframe>` : `<span>Preview iklan interstitial</span>`}</div>
    <div class="ad-gate-actions">
      <button class="btn btn-primary" id="interstitialSkipBtn" style="flex:1;" disabled>Lewati (5s)</button>
    </div>
  `;
  overlay.style.display = 'flex';
  let t = 5;
  const btn = document.getElementById('interstitialSkipBtn');
  const timer = setInterval(()=>{
    t--;
    if(t<=0){ clearInterval(timer); btn.disabled=false; btn.textContent='Lewati Iklan'; }
    else btn.textContent = `Lewati (${t}s)`;
  },1000);
  btn.addEventListener('click', ()=>{
    overlay.style.display = 'none';
    navigate(`/play/${animeId}/${epNumber}`);
  });
}
/* ============================================================
   [PATCH ad-ticket-vast — bagian 2/2] Ad Gate baru:
   Video.js + videojs-vast-vpaid, dengan fallback "Video Pendek"
   kalau VAST gagal/kosong. Selama mode 'unlock' (tiket habis),
   gate wajib diselesaikan (tombol close disembunyikan).
============================================================ */
let adGateCtx = null;
let adGatePlayer = null;
let adGateFallbackTried = false;

function openAdGate(animeId, epNumber, mode){
  adGateCtx = {animeId, epNumber, mode: mode||'unlock'};
  adGateFallbackTried = false;
  renderAdGateModal();
  const overlay = document.getElementById('adGateOverlay');
  overlay.style.display = 'flex';
  overlay.dataset.forced = adGateCtx.mode==='unlock' ? '1' : '';
}
function closeAdGate(force){
  const overlay = document.getElementById('adGateOverlay');
  if(overlay.dataset.forced==='1' && !force){
    toast('Selesaikan iklan untuk mendapatkan tiket');
    return;
  }
  overlay.style.display = 'none';
  overlay.dataset.forced = '';
  disposeAdGatePlayer();
  adGateCtx = null;
}
function disposeAdGatePlayer(){
  if(adGatePlayer){
    try{ adGatePlayer.dispose(); }catch(e){}
    adGatePlayer = null;
  }
}
function renderAdGateModal(){
  const settings = DB.getAdSettings();
  const cost = settings.ticketCostPerEpisode || 1;
  const reward = settings.ticketsPerAd || 8;
  const balance = DB.getTickets();
  const content = document.getElementById('adGateContent');
  const introText = adGateCtx.mode==='unlock'
    ? `Tiket kamu tidak cukup untuk nonton episode ini (butuh ${cost}, kamu punya ${balance}). Selesaikan iklan berikut untuk dapat ${reward} tiket.`
    : `Tonton iklan untuk mendapatkan ${reward} tiket tambahan (maks ${MAX_TICKETS}).`;
  content.innerHTML = `
    <div class="ad-gate-title">⚡ Tonton Iklan, Dapat ${reward} Tiket</div>
    <div class="ad-gate-sub">${esc(introText)}</div>
    <div class="ad-video-wrap">
      <video id="adGateVideo" class="video-js vjs-default-skin" playsinline></video>
      <div class="ad-gate-status-badge" id="adGateStatusBadge">Memuat iklan...</div>
    </div>
    <div class="ad-gate-actions" id="adGateActionsRow">
      ${adGateCtx.mode==='unlock' ? '' : `<button class="btn btn-ghost" id="adGateCancelBtn" style="flex:1;">Batal</button>`}
    </div>
  `;
  const closeBtn = document.getElementById('adGateCloseBtn');
  if(closeBtn) closeBtn.style.display = adGateCtx.mode==='unlock' ? 'none' : 'flex';
  const cancelBtn = document.getElementById('adGateCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> closeAdGate());
  startAdGateVideo();
}
function startAdGateVideo(){
  const settings = DB.getAdSettings();
  const vastUrl = (settings.vastTagUrl||'').trim();
  const fallbackUrl = (settings.videoPendekUrl||'').trim();
  const statusBadge = document.getElementById('adGateStatusBadge');

  disposeAdGatePlayer();
  adGatePlayer = videojs('adGateVideo', {
    controls:false, autoplay:true, muted:false, preload:'auto', fluid:false, inactivityTimeout:0
  });

  function goFallback(){
    if(adGateFallbackTried) return;
    adGateFallbackTried = true;
    if(!fallbackUrl){
      if(statusBadge) statusBadge.textContent = 'Iklan tidak tersedia';
      grantTicketsAndContinue();
      return;
    }
    if(statusBadge) statusBadge.textContent = 'Memuat iklan cadangan...';
    adGatePlayer.src({src:fallbackUrl, type:'video/mp4'});
    adGatePlayer.play().catch(()=>{});
    adGatePlayer.one('ended', grantTicketsAndContinue);
    adGatePlayer.one('error', grantTicketsAndContinue);
  }

  if(vastUrl){
    adGatePlayer.ready(function(){
      try{
        this.vastClient({ adTagUrl:vastUrl, playAdAlways:true, adCancelTimeout:8000, verbosity:0 });
      }catch(e){ goFallback(); }
    });
    adGatePlayer.on('vast.adStart', ()=>{ if(statusBadge) statusBadge.textContent = 'Iklan'; });
    adGatePlayer.on('vast.adEnd', grantTicketsAndContinue);
    adGatePlayer.on('vast.adError', goFallback);
    adGatePlayer.on('vast.adsCancel', goFallback);
  } else {
    goFallback();
  }
}
function grantTicketsAndContinue(){
  const settings = DB.getAdSettings();
  const reward = settings.ticketsPerAd || 8;
  DB.addTickets(reward);
  toast(`+${reward} tiket didapat!`);
  const ctx = adGateCtx;
  disposeAdGatePlayer();
  closeAdGate(true);
  if(ctx && ctx.mode==='unlock'){
    tryWatchEpisode(ctx.animeId, ctx.epNumber);
  } else {
    route();
  }
}
function checkTicketEvent(){
  const ev = DB.getTicketEvent();
  if(!ev || !ev.enabled || !ev.id || !ev.tickets) return;
  let claimed = [];
  try{ claimed = JSON.parse(localStorage.getItem(DB_KEY_CLAIMED_EVENTS)) || []; }catch(e){}
  if(claimed.includes(ev.id)) return;
  DB.addTickets(ev.tickets);
  claimed.push(ev.id);
  safeSetItem(DB_KEY_CLAIMED_EVENTS, JSON.stringify(claimed));
  setTimeout(()=> toast(`🎉 Dapat ${ev.tickets} tiket gratis — ${ev.name || 'Event'}!`), 1200);
}

function navigate(hash){ location.hash = hash; }

function isFullscreenActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
}
// Memastikan browser benar-benar keluar dari mode fullscreen SEBELUM elemen videonya
// dihapus/diganti oleh render halaman baru. Kalau tidak, browser bisa "nyangkut" di
// mode fullscreen (layar player jadi tidak responsif / tidak bisa dibuka lagi).
function safeExitFullscreen(cb){
  if(!isFullscreenActive()){ cb(); return; }
  const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if(!exitFn){ cb(); return; }
  try{
    const p = exitFn.call(document);
    if(p && typeof p.then === 'function'){ p.then(cb).catch(cb); return; }
  }catch(e){}
  setTimeout(cb, 50);
}
function safeRerender(fn){
  if(isFullscreenActive()) safeExitFullscreen(fn);
  else fn();
}

function route(){
  safeRerender(doRoute);
}
function doRoute(){
  const hash = location.hash.replace(/^#\//,'') || 'home';
  const parts = hash.split('/');
  window.scrollTo(0,0);
  updateBottomNav(parts[0]);
  renderAnnouncement();

  if(parts[0]==='home') return renderHome();
  if(parts[0]==='detail') return renderDetail(parts[1]);
  if(parts[0]==='play') return renderPlayer(parts[1], parseInt(parts[2]));
  if(parts[0]==='browse') return renderBrowse(parts[1]);
  if(parts[0]==='all') return renderAllAnime();
  if(parts[0]==='genre') return renderGenre(decodeURIComponent(parts[1]||''));
  if(parts[0]==='history') return renderHistory();
  if(parts[0]==='favorites') return renderFavorites();
  if(parts[0]==='settings') return renderSettings();
  if(parts[0]==='edit-profile') return renderEditProfile();
  return renderHome();
}

  const topbar = document.querySelector('.topbar');
  if(!topbar) return;
  const y = window.scrollY;
  if(y <= 4){
    topbar.classList.remove('hide-on-scroll');
  } else if(y > lastScrollY && y > 60){
    topbar.classList.add('hide-on-scroll');
  }
  lastScrollY = y;
}, { passive:true });

function updateBottomNav(routeName){
  const nav = document.getElementById('bottomNav');
  const hideOn = ['detail','play'];
  const showNav = !hideOn.includes(routeName);
  nav.style.display = showNav ? 'block' : 'none';
  document.body.style.paddingBottom = showNav ? '100px' : '0';
  const shown = ['home','all','history','favorites','settings'].includes(routeName) ? routeName : 'home';
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.route===shown);
  });
}
document.getElementById('bottomNav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  const icon = btn.querySelector('.nav-icon, .nav-btn-circle');
  if(icon){
    icon.classList.remove('pop');
    void icon.offsetWidth;
    icon.classList.add('pop');
  }
  navigate('/'+btn.dataset.route);
});

  const a = DB.getAnime(animeId);

  const episodes = [...a.episodes].sort((x,y)=>x.number-y.number);

  DB.addHistory(a.id, ep.number);

  const prevEp = episodes[epIdx-1];
  const nextEp = episodes[epIdx+1];

  const qualityOrder = DB.getResolutions();
  const availableQ = qualityOrder.filter(q=> ep.videoUrls && ep.videoUrls[q]);
  if(!currentQuality || !availableQ.includes(currentQuality)){
    currentQuality = availableQ.length ? availableQ[availableQ.length-1] : null;
  }
  const videoUrl = currentQuality ? ep.videoUrls[currentQuality] : null;

  if(backBtn) backBtn.addEventListener('click', ()=> safeExitFullscreen(()=> window.history.back()));
  document.querySelectorAll('.q-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentQuality = btn.dataset.q;
      safeRerender(()=> renderPlayer(animeId, epNumber));
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevEp) prevBtn.addEventListener('click', ()=> tryWatchEpisode(a.id, prevEp.number));
  if(nextEp) nextBtn.addEventListener('click', ()=> tryWatchEpisode(a.id, nextEp.number));
