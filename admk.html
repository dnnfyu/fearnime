<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fearnime — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#050f0b;
    --bg-elevated:rgba(215,242,228,.11);
    --card:rgba(215,242,228,.08);
    --card-hover:rgba(215,242,228,.15);
    --border:rgba(90,168,134,.25);
    --text:#e9f5ef;
    --text-dim:#9dc0ac;
    --text-faint:#5f8272;
    --accent:#22c55e;
    --accent-dim:#22c55e26;
    --accent-2:#4ade80;
    --ongoing:#4ade80;
    --ended:#4a6357;
    --radius:10px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background-color:#060f0d;
    background-image:
      radial-gradient(34% 26% at 86% 10%, rgba(94,234,150,.26) 0%, rgba(94,234,150,0) 72%),
      radial-gradient(26% 20% at 5% 96%, rgba(45,190,140,.18) 0%, rgba(45,190,140,0) 72%),
      radial-gradient(55% 42% at 50% -10%, rgba(20,72,52,.4) 0%, rgba(20,72,52,0) 68%);
    background-repeat:no-repeat;
    background-attachment:fixed, fixed, fixed;
    color:var(--text); font-family:var(--font-body);
  }
  body{min-height:100vh; padding-bottom:40px;}
  img{max-width:100%; display:block;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, textarea, select{font-family:inherit;}

  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(6,20,15,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:14px 20px 0;
  }
  .topbar-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:14px;}
  .admin-nav{display:flex; gap:4px; overflow-x:auto;}
  .admin-nav button{
    flex-shrink:0; padding:10px 14px; font-size:12.5px; font-weight:700; color:var(--text-faint);
    background:transparent; border:none; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .admin-nav button.active{color:var(--accent); border-bottom-color:var(--accent);}
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-mark-icon{width:32px; height:32px; flex-shrink:0; object-fit:contain; border-radius:9px;}
  .brand-mark-word{font-family:var(--font-display); font-size:24px; letter-spacing:1px; color:var(--text); line-height:1;}
  .brand-mark-word b{color:var(--accent); font-weight:400;}
  .brand-mark small{display:block; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:2px; margin-top:3px;}
  .btn{
    padding:10px 18px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); font-weight:700; font-size:13px;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:active{background:var(--card-hover);}
  .btn:disabled{opacity:.5; pointer-events:none;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-danger{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:7px 12px; font-size:12px;}
  .btn svg{width:15px; height:15px;}

  .wrap{max-width:900px; margin:0 auto; padding:22px 18px;}

  .stats-row{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .stat-card{flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .stat-num{font-family:var(--font-display); font-size:26px; letter-spacing:.5px;}
  .stat-label{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-box{flex:1; min-width:200px; padding:10px 14px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); font-size:13px;}
  .search-box:focus{outline:none; border-color:var(--accent);}

  .anime-table{display:flex; flex-direction:column; gap:10px;}
  .anime-row{
    display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
  }
  .anime-row img{width:52px; aspect-ratio:2/3; object-fit:cover; border-radius:6px; background:var(--bg-elevated); flex-shrink:0;}
  .anime-row-body{flex:1; min-width:0;}
  .anime-row-title{font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .anime-row-meta{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .pill{padding:1px 8px; border-radius:4px; font-size:10px; font-weight:800;}
  .pill.Ongoing{background:var(--ongoing); color:#06210f;}
  .pill.Completed{background:var(--ended); color:#fff;}
  .anime-row-actions{display:flex; gap:8px; flex-shrink:0;}

  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty .big{font-family:var(--font-display); font-size:22px; color:var(--text-dim); display:block; margin-bottom:6px;}

  .form-header{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .form-header h2{font-family:var(--font-display); font-size:24px; font-weight:400; letter-spacing:.5px;}

  .panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .panel h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); font-family:var(--font-mono); margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .panel h3 .dot{width:6px; height:6px; background:var(--accent); display:inline-block; border-radius:1px;}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  @media(max-width:600px){.field-row{grid-template-columns:1fr;}}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text-dim);}
  .field .hint{font-size:11px; color:var(--text-faint); margin-top:5px;}
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text); font-size:13.5px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:90px; line-height:1.5;}

  .poster-preview{width:90px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--bg-elevated); border:1px solid var(--border); margin-top:8px;}
  .poster-preview img{width:100%; height:100%; object-fit:cover;}

  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:6px;}

  .reso-check-row{display:flex; gap:10px; flex-wrap:wrap;}
  .reso-check{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--text-dim); background:var(--bg-elevated); border:1px solid var(--border); padding:9px 14px; border-radius:8px;}
  .reso-check input{width:15px; height:15px; accent-color:var(--accent);}
  .ep-url-fields{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .ep-list{display:flex; flex-direction:column; gap:8px;}
  .ep-row{display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px;}
  .ep-row-num{width:32px; height:32px; border-radius:7px; background:var(--card); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; flex-shrink:0;}
  .ep-row-body{flex:1; min-width:0; font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}
  .ep-row-body div{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ep-row-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-sq{width:34px; height:34px; border-radius:8px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
  .icon-sq svg{width:14px; height:14px;}
  .icon-sq:active{background:var(--card-hover);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--card); border:1px solid var(--border); padding:12px 22px; border-radius:999px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:all .25s ease; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .bulk-row{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; position:relative;}
  .bulk-row-num{position:absolute; top:14px; right:16px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
  .bulk-row .field-row{margin-bottom:10px;}
  .bulk-row .field{margin-bottom:10px;}
  .add-row-btn{
    width:100%; padding:14px; border-radius:var(--radius); border:1px dashed var(--border);
    background:transparent; color:var(--text-dim); font-weight:700; font-size:13px; margin-bottom:18px;
  }
  .add-row-btn:active{background:var(--bg-elevated);}
  .bulk-summary{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin-bottom:14px;}

  /* ---------- Login gate ---------- */
  .login-gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-gate-card{
    width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:32px 26px; text-align:center; backdrop-filter:blur(10px);
  }
  .login-gate-logo{width:56px; height:56px; border-radius:14px; margin:0 auto 16px; object-fit:contain;}
  .login-gate-title{font-family:var(--font-display); font-size:26px; letter-spacing:.5px; margin-bottom:6px;}
  .login-gate-title b{color:var(--accent); font-weight:400;}
  .login-gate-sub{font-size:12.5px; color:var(--text-faint); line-height:1.6; margin-bottom:22px;}
  #adminGoogleBtnWrap{display:flex; justify-content:center; min-height:44px;}
  .login-gate-loading{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}
  .login-gate-error{
    margin-top:16px; padding:10px 12px; border-radius:8px; font-size:12px; text-align:left;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4); color:#f87171; display:none;
  }
  .admin-user-chip{
    display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:999px;
    background:var(--bg-elevated); border:1px solid var(--border); flex-shrink:0;
  }
  .admin-user-chip img{width:26px; height:26px; border-radius:50%; object-fit:cover; background:var(--card);}
  .admin-user-chip span{font-size:11.5px; font-weight:700; color:var(--text-dim); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .admin-user-chip button{color:var(--text-faint); font-size:11px; font-weight:800; padding:0 4px; background:none; border:none;}
</style>
</head>
<body>
<div class="login-gate" id="loginGate">
  <div class="login-gate-card">
    <img class="login-gate-logo" id="loginGateLogo" src="" alt="Fearnime">
    <div class="login-gate-title">FEAR<b>NIME</b></div>
    <div class="login-gate-sub">Masuk dengan akun Google admin untuk mengelola konten Fearnime.</div>
    <div id="adminGoogleBtnWrap"><span class="login-gate-loading">Memuat tombol login...</span></div>
    <div class="login-gate-error" id="loginGateError"></div>
  </div>
</div>
<div id="adminShell" style="display:none;">
<div class="topbar">
  <div class="topbar-top">
    <div class="brand-mark" id="adminBrandMark">
      <img class="brand-mark-icon" id="adminBrandMarkIcon" src="" alt="Fearnime">
      <div>
        <div class="brand-mark-word">FEAR<b>NIME</b></div>
        <small>ADMIN PANEL</small>
      </div>
    </div>
    <div class="admin-user-chip" id="adminUserChip"></div>
  </div>
  <nav class="admin-nav" id="adminNav">
    <button data-view="list">Daftar Anime</button>
    <button data-view="add">+ Tambah Anime</button>
    <button data-view="bulk">+ Tambah Banyak</button>
    <button data-view="genres">Genre</button>
    <button data-view="resolutions">Resolusi</button>
    <button data-view="announcement">Pengumuman</button>
    <button data-view="ads">Iklan &amp; Tiket</button>
    <button data-view="settings">Pengaturan</button>
  </nav>
</div>
<div class="wrap" id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Data layer — fetch ke Cloudflare Worker (D1), bukan localStorage lagi.
   Baca: publik (GET). Tulis: butuh token Google admin (Authorization: Bearer).
============================================================ */
const API_BASE = 'https://fearnime-api.prtamadnn.workers.dev';
const GOOGLE_CLIENT_ID = '427132462258-6n8i6j3j0f97lts084fp5hvsrrpjj2vp.apps.googleusercontent.com';
const DB_KEY_HISTORY = 'fearnime_history';
const DB_KEY_FAVORITES = 'fearnime_favorites';
const DB_KEY_ADMIN_SESSION = 'fearnime_admin_session';
const AD_TYPES = ['Banner','Interstitial','Rewarded (Dapat Tiket)','Native/In-Feed'];
const SEED_GENRES = ['Action','Adventure','Comedy','Demons','Drama','Ecchi','Fantasy','Game','Harem','Historical'];
const SEED_RESOLUTIONS = ['360p','480p','720p','1080p'];
const MAX_TICKETS = 999;
const DEFAULT_LOGO_URL = 'https://placehold.co/64x64/22c55e/06210f?text=F';

function safeSetItem(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.warn('Penyimpanan lokal penuh, gagal menyimpan:', key); return false; }
}

/* ---------- Sesi admin (token Google, disimpan di sessionStorage) ---------- */
let adminSession = null; // {token, name, email, picture, exp}
function loadAdminSession(){
  try{ return JSON.parse(sessionStorage.getItem(DB_KEY_ADMIN_SESSION)) || null; }
  catch(e){ return null; }
}
function saveAdminSession(s){ sessionStorage.setItem(DB_KEY_ADMIN_SESSION, JSON.stringify(s)); }
function clearAdminSession(){ sessionStorage.removeItem(DB_KEY_ADMIN_SESSION); adminSession = null; }
function isSessionValid(s){ return !!(s && s.token && s.exp && Date.now() < s.exp * 1000); }

/* ---------- Fetch helpers ---------- */
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('GET ' + path + ' -> ' + res.status);
  return res.json();
}
async function apiWrite(method, path, body){
  if(!isSessionValid(adminSession)){
    forceReLogin('Sesi login sudah habis, silakan login ulang.');
    throw new Error('Sesi habis');
  }
  const res = await fetch(API_BASE + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + adminSession.token
    },
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if(res.status === 401){
    forceReLogin('Login ditolak server (token tidak valid / bukan admin).');
    throw new Error('401 Unauthorized');
  }
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(method + ' ' + path + ' -> ' + res.status + ' ' + t);
  }
  return res.json().catch(()=> ({}));
}
function forceReLogin(msg){
  clearAdminSession();
  const shell = document.getElementById('adminShell');
  if(shell) shell.style.display = 'none';
  const gate = document.getElementById('loginGate');
  if(gate) gate.style.display = 'flex';
  showLoginError(msg);
  initAdminGoogleAuth();
}

/* ---------- Google Sign-In (admin) ---------- */
function decodeJwtResponse(token){
  try{
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c=>
      '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(jsonPayload);
  }catch(e){ return null; }
}
function showLoginError(msg){
  const el = document.getElementById('loginGateError');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}
function hideLoginError(){
  const el = document.getElementById('loginGateError');
  if(el){ el.style.display = 'none'; el.textContent = ''; }
}
function initAdminGoogleAuth(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleAdminCredentialResponse,
    auto_select: false
  });
  const wrap = document.getElementById('adminGoogleBtnWrap');
  if(wrap){
    wrap.innerHTML = '';
    google.accounts.id.renderButton(wrap, { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', width:280 });
  }
}
async function handleAdminCredentialResponse(response){
  hideLoginError();
  const payload = decodeJwtResponse(response.credential);
  if(!payload){ showLoginError('Gagal membaca data akun Google.'); return; }
  adminSession = {
    token: response.credential,
    name: payload.name || '',
    email: payload.email || '',
    picture: payload.picture || '',
    exp: payload.exp
  };
  saveAdminSession(adminSession);
  await enterAdminShell();
}
async function enterAdminShell(){
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('adminShell').style.display = 'block';
  renderAdminUserChip();
  try{
    await loadAdminData();
  }catch(e){
    console.warn(e);
    toast('Gagal memuat sebagian data dari server');
  }
  renderAdminBrandMark();
  renderList();
}
function renderAdminUserChip(){
  const chip = document.getElementById('adminUserChip');
  if(!chip || !adminSession) return;
  chip.innerHTML = `
    <img src="${esc(adminSession.picture)}" alt="" onerror="this.style.opacity=0">
    <span>${esc(adminSession.name || adminSession.email || 'Admin')}</span>
    <button id="adminLogoutBtn" title="Keluar">Keluar</button>
  `;
  const btn = document.getElementById('adminLogoutBtn');
  if(btn) btn.addEventListener('click', adminLogout);
}
function adminLogout(){
  clearAdminSession();
  if(window.google && google.accounts && google.accounts.id){
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  document.getElementById('adminShell').style.display = 'none';
  document.getElementById('loginGate').style.display = 'flex';
  hideLoginError();
  toast('Berhasil logout');
  initAdminGoogleAuth();
}

/* ---------- Cache lokal, diisi dari API setelah login ---------- */
const CACHE = {
  animes: [], genres: [...SEED_GENRES], resolutions: [...SEED_RESOLUTIONS],
  settings: {logoUrl:'', splashLogoUrl:'', splashTagline:'STREAMING SEREM · SUB INDO'},
  adSettings: {adGateEnabled:false, ticketsPerAd:3, ticketCostPerEpisode:1},
  adSlots: [], announcement: {enabled:false, text:''}, ticketEvent: null
};
async function loadAdminData(){
  const [animes, genres, resolutions, settings, adSettings, adSlots, announcement, ticketEvent] = await Promise.all([
    apiGet('/api/animes'), apiGet('/api/genres'), apiGet('/api/resolutions'),
    apiGet('/api/settings'), apiGet('/api/ad-settings'), apiGet('/api/ad-slots'),
    apiGet('/api/announcement'), apiGet('/api/ticket-event')
  ]);
  CACHE.animes = animes || [];
  CACHE.genres = genres && genres.length ? genres : [...SEED_GENRES];
  CACHE.resolutions = resolutions && resolutions.length ? resolutions : [...SEED_RESOLUTIONS];
  if(settings) CACHE.settings = Object.assign({}, CACHE.settings, settings);
  if(adSettings) CACHE.adSettings = Object.assign({}, CACHE.adSettings, adSettings);
  CACHE.adSlots = adSlots || [];
  if(announcement) CACHE.announcement = announcement;
  CACHE.ticketEvent = ticketEvent || null;
}

const DB = {
  getAnimes(){ return CACHE.animes; },
  getAnime(id){ return CACHE.animes.find(a=>a.id===id) || null; },
  async upsertAnime(anime){
    const saved = await apiWrite('POST', '/api/admin/animes', anime);
    const idx = CACHE.animes.findIndex(a=>a.id===saved.id);
    if(idx>-1) CACHE.animes[idx] = saved; else CACHE.animes.unshift(saved);
    return saved;
  },
  async bulkInsert(animes){
    const saved = await apiWrite('POST', '/api/admin/animes/bulk', animes);
    CACHE.animes = [...saved, ...CACHE.animes];
    return saved;
  },
  async deleteAnime(id){
    await apiWrite('DELETE', '/api/admin/animes/' + encodeURIComponent(id));
    CACHE.animes = CACHE.animes.filter(a=>a.id!==id);
  },
  async upsertEpisode(animeId, number, videoUrls){
    const saved = await apiWrite('POST', '/api/admin/episodes', { animeId, number, videoUrls });
    const idx = CACHE.animes.findIndex(a=>a.id===animeId);
    if(idx>-1) CACHE.animes[idx] = saved;
    return saved;
  },
  async deleteEpisode(animeId, number){
    await apiWrite('DELETE', `/api/admin/episodes/${encodeURIComponent(animeId)}/${number}`);
    const anime = CACHE.animes.find(a=>a.id===animeId);
    if(anime) anime.episodes = anime.episodes.filter(e=>e.number!==number);
  },
  getAnnouncement(){ return CACHE.announcement; },
  async saveAnnouncement(ann){
    await apiWrite('PUT', '/api/admin/announcement', ann);
    CACHE.announcement = ann;
  },
  getSettings(){ return CACHE.settings; },
  async saveSettings(s){
    await apiWrite('PUT', '/api/admin/settings', s);
    CACHE.settings = s;
  },
  getAdSettings(){ return CACHE.adSettings; },
  async saveAdSettings(s){
    await apiWrite('PUT', '/api/admin/ad-settings', s);
    CACHE.adSettings = s;
  },
  getAdSlots(){ return CACHE.adSlots; },
  async upsertAdSlot(slot){
    const saved = await apiWrite('POST', '/api/admin/ad-slots', slot);
    const idx = CACHE.adSlots.findIndex(s=>s.id===saved.id);
    if(idx>-1) CACHE.adSlots[idx] = saved; else CACHE.adSlots.unshift(saved);
    return saved;
  },
  async deleteAdSlot(id){
    await apiWrite('DELETE', '/api/admin/ad-slots/' + encodeURIComponent(id));
    CACHE.adSlots = CACHE.adSlots.filter(s=>s.id!==id);
  },
  getTicketEvent(){ return CACHE.ticketEvent; },
  async saveTicketEvent(ev){
    await apiWrite('PUT', '/api/admin/ticket-event', ev);
    CACHE.ticketEvent = ev;
  },
  getGenres(){ return CACHE.genres; },
  async addGenre(name){
    await apiWrite('POST', '/api/admin/genres', { name });
    CACHE.genres.push(name);
  },
  async deleteGenre(name){
    await apiWrite('DELETE', '/api/admin/genres/' + encodeURIComponent(name));
    CACHE.genres = CACHE.genres.filter(g=>g!==name);
  },
  getResolutions(){ return CACHE.resolutions; },
  async addResolution(name){
    await apiWrite('POST', '/api/admin/resolutions', { name });
    CACHE.resolutions.push(name);
  },
  async deleteResolution(name){
    await apiWrite('DELETE', '/api/admin/resolutions/' + encodeURIComponent(name));
    CACHE.resolutions = CACHE.resolutions.filter(r=>r!==name);
  },
  clearVisitorCache(){
    localStorage.removeItem(DB_KEY_HISTORY);
    localStorage.removeItem(DB_KEY_FAVORITES);
  },
  async resetAllAnimes(){
    for(const a of [...CACHE.animes]){ await this.deleteAnime(a.id); }
  }
};
function getResoList(){ return DB.getResolutions(); }

function uid(){ return 'a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__t); window.__t=setTimeout(()=>t.classList.remove('show'),1800);
}
function latestEpisodeNumber(a){
  if(!a.episodes || !a.episodes.length) return 0;
  return Math.max(...a.episodes.map(e=>e.number));
}

/* ---------- episode sub-panel: resolusi dinamis dari tab "Resolusi" ---------- */
let epPanelAnimeId = null;
let epFormChecked = {};
let epFormUrls = {};
let epEditingNum = null;
function resetEpForm(){
  epFormChecked = {};
  epFormUrls = {};
  getResoList().forEach(q=>{ epFormChecked[q] = false; epFormUrls[q] = ''; });
  epEditingNum = null;
}
function renderEpisodePanel(a){
  if(epPanelAnimeId !== a.id){ resetEpForm(); epPanelAnimeId = a.id; }
  const episodes = [...(a.episodes||[])].sort((x,y)=>x.number-y.number);
  const nextNum = episodes.length ? Math.max(...episodes.map(e=>e.number))+1 : 1;
  const epNumValue = epEditingNum!=null ? epEditingNum : nextNum;
  const resoList = getResoList();
  return `
    <div class="panel">
      <h3><span class="dot"></span>Kelola Episode <span style="color:var(--text-faint); font-weight:400;">(${episodes.length} episode · terbaru: Ep ${episodes.length?latestEpisodeNumber(a):'-'})</span></h3>

      <div class="field">
        <label>No. Episode</label>
        <input id="ep_num" type="number" min="1" value="${epNumValue}">
      </div>

      <div class="field">
        <label>Pilih Resolusi <span style="font-weight:400;color:var(--text-faint);">(boleh pilih lebih dari satu — kelola daftar resolusi di tab "Resolusi")</span></label>
        <div class="reso-check-row">
          ${resoList.length ? resoList.map(q=>`
            <label class="reso-check">
              <input type="checkbox" class="ep_reso_chk" data-q="${esc(q)}" ${epFormChecked[q]?'checked':''}>
              ${esc(q)}
            </label>
          `).join('') : `<p style="font-size:12px;color:var(--text-faint);">Belum ada resolusi. Tambahkan dulu di tab "Resolusi".</p>`}
        </div>
      </div>

      <div id="epUrlFields" class="ep-url-fields"></div>

      <div class="form-actions" style="justify-content:flex-start; margin-top:14px;">
        <button class="btn btn-primary" id="addEpBtn">${epEditingNum!=null?'Update Episode':'+ Tambah Episode'}</button>
        ${epEditingNum!=null?`<button class="btn btn-ghost" id="cancelEpEditBtn">Batal</button>`:''}
      </div>

      <div class="ep-list" id="epList" style="margin-top:20px;">
        ${episodes.length ? episodes.map(e=>`
          <div class="ep-row">
            <div class="ep-row-num">${e.number}</div>
            <div class="ep-row-body">
              ${getResoList().map(q => (e.videoUrls&&e.videoUrls[q]) ? `<div>${esc(q)}: ${esc(e.videoUrls[q])}</div>` : '').join('') || '<div>Belum ada URL video</div>'}
            </div>
            <div class="ep-row-actions">
              <button class="icon-sq" data-editep="${e.number}">${ICONS.edit}</button>
              <button class="icon-sq" data-delep="${e.number}">${ICONS.trash}</button>
            </div>
          </div>
        `).join('') : `<p style="font-size:12.5px; color:var(--text-faint);">Belum ada episode. Tambahkan episode pertama di atas.</p>`}
      </div>
    </div>
  `;
}
function renderEpUrlFields(){
  const wrap = document.getElementById('epUrlFields');
  if(!wrap) return;
  const checkedList = getResoList().filter(q=>epFormChecked[q]);
  wrap.innerHTML = checkedList.length ? checkedList.map(q=>`
    <div class="field" style="margin-bottom:0;">
      <label>URL Video ${esc(q)}</label>
      <input class="ep_url_input" data-q="${esc(q)}" value="${esc(epFormUrls[q]||'')}" placeholder="https://drive.google.com/...">
    </div>
  `).join('') : `<p style="font-size:12px;color:var(--text-faint);">Centang minimal satu resolusi di atas.</p>`;
  wrap.querySelectorAll('.ep_url_input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ epFormUrls[inp.dataset.q] = inp.value; });
  });
}
function bindEpisodePanel(animeId){
  renderEpUrlFields();
  document.querySelectorAll('.ep_reso_chk').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      epFormChecked[chk.dataset.q] = chk.checked;
      renderEpUrlFields();
    });
  });

  const addBtn = document.getElementById('addEpBtn');
  if(addBtn){
    addBtn.addEventListener('click', async ()=>{
      const num = parseInt(document.getElementById('ep_num').value);
      if(!num || num<1){ toast('Nomor episode tidak valid'); return; }
      const videoUrls = {};
      let hasAny = false;
      getResoList().forEach(q=>{
        if(epFormChecked[q] && (epFormUrls[q]||'').trim()){
          videoUrls[q] = epFormUrls[q].trim();
          hasAny = true;
        }
      });
      if(!hasAny){ toast('Isi minimal 1 URL video untuk resolusi yang dicentang'); return; }
      const anime = DB.getAnime(animeId);
      if(epEditingNum==null && anime.episodes.some(e=>e.number===num)){
        toast('Episode dengan nomor ini sudah ada'); return;
      }
      addBtn.disabled = true;
      try{
        await DB.upsertEpisode(animeId, num, videoUrls);
        toast(epEditingNum!=null ? 'Episode diperbarui' : 'Episode ditambahkan');
        resetEpForm();
        renderForm(animeId);
      }catch(e){
        console.warn(e);
        toast('Gagal menyimpan episode ke server');
        addBtn.disabled = false;
      }
    });
  }
  const cancelBtn = document.getElementById('cancelEpEditBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ resetEpForm(); renderForm(animeId); });

  document.querySelectorAll('[data-editep]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.dataset.editep);
      const anime = DB.getAnime(animeId);
      const ep = anime.episodes.find(e=>e.number===num);
      epEditingNum = num;
      epFormChecked = {};
      epFormUrls = {};
      getResoList().forEach(q=>{
        epFormChecked[q] = !!(ep.videoUrls && ep.videoUrls[q]);
        epFormUrls[q] = (ep.videoUrls && ep.videoUrls[q]) || '';
      });
      renderForm(animeId);
    });
  });
  document.querySelectorAll('[data-delep]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const num = parseInt(btn.dataset.delep);
      if(!confirm(`Hapus episode ${num}?`)) return;
      btn.disabled = true;
      try{
        await DB.deleteEpisode(animeId, num);
        if(epEditingNum===num) resetEpForm();
        toast('Episode dihapus');
        renderForm(animeId);
      }catch(e){
        console.warn(e);
        toast('Gagal menghapus episode di server');
        btn.disabled = false;
      }
    });
  });
}

let bulkRows = [];

function renderBulkRows(){

  wrap.innerHTML = bulkRows.map((r,i)=>`

        </div>
        <div class="field">
          <label>Studio</label>
          <input class="br_studio" value="${esc(r.studio)}" placeholder="Nama studio">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tipe</label>

          </select>

        <div class="field">
          <label>Status</label>
          <select class="br_status">
            <option value="Ongoing" ${r.status==='Ongoing'?'selected':''}>Ongoing</option>
            <option value="Completed" ${r.status==='Completed'?'selected':''}>Completed</option>
          </select>
        </div>
      </div>

        <div class="field">
          <label>Sampai Episode Berapa</label>
          <input class="br_total" type="number" min="0" value="${r.totalEpisode||0}">
        </div>
        <div class="field">
          <label>Rating (0-10)</label>
          <input class="br_rating" type="number" min="0" max="10" step="0.01" value="${r.rating||0}">
        </div>
      </div>
      <div class="field">
        <label>Genre <span style="font-weight:400; color:var(--text-faint);">(pisahkan koma)</span></label>
        <input class="br_genres" value="${esc(r.genres)}" placeholder="Action, Fantasy">
      </div>
      <div class="field">
        <label>Sinopsis</label>
        <textarea class="br_synopsis" style="min-height:60px;" placeholder="Sinopsis singkat...">${esc(r.synopsis)}</textarea>
      </div>
      <button class="btn btn-sm btn-danger bulk-remove" data-remove="${i}">${ICONS.trash} Hapus Baris</button>
    </div>
  `).join('');

  wrap.querySelectorAll('.bulk-row').forEach(rowEl=>{
    const idx = parseInt(rowEl.dataset.idx);
    const bind = (cls, key)=>{
      const el = rowEl.querySelector('.'+cls);
      el.addEventListener('input', ()=>{ bulkRows[idx][key] = el.value; });
      el.addEventListener('change', ()=>{ bulkRows[idx][key] = el.value; });
    };
    bind('br_title','title'); bind('br_poster','poster'); bind('br_studio','studio');
    bind('br_type','type'); bind('br_status','status'); bind('br_total','totalEpisode');
    bind('br_rating','rating'); bind('br_genres','genres'); bind('br_synopsis','synopsis');
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bulkRows.splice(parseInt(btn.dataset.remove),1);
      if(bulkRows.length===0) bulkRows.push(newBulkRow());
      renderBulkRows();
    });
  });
}
async function saveBulkRows(){
  const valid = bulkRows.filter(r=>r.title && r.title.trim());
  if(!valid.length){ toast('Isi minimal 1 judul anime'); return; }
  const now = Date.now();
  const animesToInsert = valid.map((r,i)=>({
    id: uid(),
    title: r.title.trim(),
    poster: (r.poster||'').trim(),
    synopsis: (r.synopsis||'').trim(),
    genres: (r.genres||'').split(',').map(g=>g.trim()).filter(Boolean),
    studio: (r.studio||'').trim(),
    type: r.type || 'Series',
    totalEpisode: parseInt(r.totalEpisode)||0,
    status: r.status || 'Ongoing',
    rating: parseFloat(r.rating)||0,
    episodes: [],
    createdAt: now + i,
    updatedAt: now + i
  }));
  const btn = document.getElementById('saveBulkBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  try{
    const saved = await DB.bulkInsert(animesToInsert);
    toast(`${saved.length} anime berhasil ditambahkan`);
    bulkRows = [];
    renderList();
  }catch(e){
    console.warn(e);
    toast('Gagal menyimpan ke server');
    if(btn){ btn.disabled = false; btn.textContent = 'Simpan Semua Anime'; }
  }
}

        <div class="field">
          <label>Jumlah Tiket Gratis</label>
          <input id="ev_tickets" type="number" min="1" max="${MAX_TICKETS}" value="${ev?ev.tickets:50}">

      type: document.getElementById('as_type').value,
      code: document.getElementById('as_code').value,

      btn.disabled = true;

        console.warn(e);
        toast('Gagal menghapus di server');
        btn.disabled = false;
      }
    });
  });

  document.getElementById('startEventBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('ev_name').value.trim();
    const tickets = Math.min(MAX_TICKETS, parseInt(document.getElementById('ev_tickets').value)||0);
    if(!name || !tickets){ toast('Isi nama event dan jumlah tiket dulu'); return; }

    btn.disabled = true;
    try{
      await DB.saveTicketEvent({ id:'ev_'+Date.now().toString(36), name, tickets, enabled:true, updatedAt:Date.now() });
      toast('Event tiket gratis diaktifkan');
      renderAdsPanel();
    }catch(e){
      console.warn(e);
      toast('Gagal menyimpan ke server');
      btn.disabled = false;
    }
  });
  const stopEventBtn = document.getElementById('stopEventBtn');
  if(stopEventBtn){
    stopEventBtn.addEventListener('click', async ()=>{
      const cur = DB.getTicketEvent();
      stopEventBtn.disabled = true;
      try{
        if(cur){ cur.enabled = false; await DB.saveTicketEvent(cur); }

        renderAdsPanel();

        console.warn(e);
        toast('Gagal menyimpan ke server');
        stopEventBtn.disabled = false;
      }
    });
  }
}

function setActiveNav(view){
  document.querySelectorAll('#adminNav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
}
document.getElementById('adminNav').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const view = btn.dataset.view;
  if(view==='list') renderList();
  else if(view==='add') renderForm(null);
  else if(view==='bulk') renderBulkAdd();
  else if(view==='genres') renderGenresPanel();
  else if(view==='resolutions') renderResolutionsPanel();
  else if(view==='announcement') renderAnnouncementPanel();
  else if(view==='ads'){ adSlotEditingId=null; renderAdsPanel(); }
  else if(view==='settings') renderSettingsPanel();
});

(function initAdminApp(){
  const gateLogo = document.getElementById('loginGateLogo');
  if(gateLogo) gateLogo.src = DEFAULT_LOGO_URL;
  // Ambil logo situs (endpoint publik) supaya logo di layar login juga sesuai,
  // tanpa perlu login dulu.
  apiGet('/api/settings').then(s=>{
    if(s && s.logoUrl && gateLogo) gateLogo.src = s.logoUrl;
  }).catch(()=>{});

  adminSession = loadAdminSession();
  if(isSessionValid(adminSession)){
    enterAdminShell();
    return;
  }
  clearAdminSession();

  // Skrip Google Identity Services dimuat secara async — tunggu sampai siap
  // sebelum mencoba menampilkan tombol login.
  function waitForGoogle(){
    if(window.google && google.accounts && google.accounts.id){
      initAdminGoogleAuth();
    } else {
      setTimeout(waitForGoogle, 150);
    }
  }
  waitForGoogle();
})();
